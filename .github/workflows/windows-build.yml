      - name: Prepare layered security diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $source = @'
          package main
          
          import (
          	"fmt"
          	"net"
          	"net/url"
          	"strings"
          	"unicode"
          )
          
          type LinkAssessment struct {
          	Host       string   `json:"host"`
          	Signals    []string `json:"signals"`
          	Assessment string   `json:"assessment"`
          }
          
          // Local structural triage only. Never resolves, fetches, or opens the URL.
          func assessLink(raw string) (LinkAssessment, error) {
          	r := LinkAssessment{Signals: []string{}, Assessment: "Inconclusivo: nenhum indicador estrutural identificado"}
          	raw = strings.TrimSpace(raw)
          	if len(raw) == 0 || len(raw) > 8192 {
          		return r, fmt.Errorf("Informe uma URL HTTP ou HTTPS de até 8192 bytes")
          	}
          	if strings.Contains(raw, "\\") || strings.IndexFunc(raw, unicode.IsControl) >= 0 || strings.IndexFunc(raw, unicode.IsSpace) >= 0 {
          		return r, fmt.Errorf("URL ambígua ou inválida")
          	}
          	u, e := url.Parse(raw)
          	if e != nil || u.Hostname() == "" || u.Opaque != "" || (u.Scheme != "http" && u.Scheme != "https") {
          		return r, fmt.Errorf("Informe um endereço HTTP ou HTTPS válido")
          	}
          	host := strings.TrimSuffix(strings.ToLower(u.Hostname()), ".")
          	r.Host = host
          	add := func(s string) { r.Signals = append(r.Signals, s) }
          	if u.Scheme == "http" {
          		add("HTTP sem criptografia: não envie senhas ou dados bancários")
          	}
          	if u.User != nil {
          		add("Identificação antes de @ pode disfarçar o domínio real")
          	}
          	if net.ParseIP(host) != nil {
          		add("Endereço IP em vez de nome de domínio")
          	}
          	if strings.Contains(host, "xn--") || strings.IndexFunc(host, func(r rune) bool { return r > 127 }) >= 0 {
          		add("Domínio internacionalizado: verifique possíveis caracteres parecidos")
          	}
          	if len(strings.Split(host, ".")) >= 5 {
          		add("Muitos subdomínios: confira o domínio registrado")
          	}
          	if p := u.Port(); p != "" && p != "80" && p != "443" {
          		add("Porta não convencional")
          	}
          	if strings.Contains(strings.ToLower(u.RawQuery), "redirect=") || strings.Contains(strings.ToLower(u.RawQuery), "url=") {
          		add("Parâmetro de possível redirecionamento")
          	}
          	if len(r.Signals) > 0 {
          		r.Assessment = "Atenção: indicadores estruturais; não comprovam fraude"
          	}
          	return r, nil
          }
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'linkcheck.go'), $source, $utf8)
          $source = @'
          package main
          
          import "testing"
          
          func TestLinkTriage(t *testing.T) {
          	for _, tc := range []struct {
          		url, host string
          		signals   int
          		invalid   bool
          	}{
          		{"https://example.org/", "example.org", 0, false},
          		{"http://example.org/", "example.org", 1, false},
          		{"https://example.org@127.0.0.1:8080/", "127.0.0.1", 3, false},
          		{"https://xn--example-9d0b.com/", "xn--example-9d0b.com", 1, false},
          		{"https://a.b.c.d.example.org/", "a.b.c.d.example.org", 1, false},
          		{"file:///C:/Windows/", "", 0, true},
          		{"https://example.org\\@other.test/", "", 0, true},
          		{"https://example.org/\nx", "", 0, true},
          		{"https://example.org/?url=https%3A%2F%2Fother.test", "example.org", 1, false},
          	} {
          		r, e := assessLink(tc.url)
          		if tc.invalid {
          			if e == nil {
          				t.Fatalf("expected invalid %q", tc.url)
          			}
          			continue
          		}
          		if e != nil || r.Host != tc.host || len(r.Signals) != tc.signals {
          			t.Fatalf("%q: %+v %v", tc.url, r, e)
          		}
          	}
          }
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'linkcheck_test.go'), $source, $utf8)
          $source = @'
          package main
          
          import (
          	"context"
          	"encoding/json"
          	"fmt"
          	"os"
          	"os/exec"
          	"path/filepath"
          	"syscall"
          	"time"
          )
          
          // Read-only audit. Errors remain visible; unknown is never reported as protected.
          func windowsSecurityAudit() (map[string]any, error) {
          	root := os.Getenv("SystemRoot")
          	if root == "" {
          		return nil, fmt.Errorf("SystemRoot indisponível")
          	}
          	ps := filepath.Join(root, "System32", "WindowsPowerShell", "v1.0", "powershell.exe")
          	script := `[Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
           $r=[ordered]@{defender=$null;firewall=$null;updates=$null;policies=$null;errors=@()}
           try {$d=Get-MpComputerStatus -ErrorAction Stop;$r.defender=[ordered]@{antivirus=$d.AntivirusEnabled;realTime=$d.RealTimeProtectionEnabled;behavior=$d.BehaviorMonitorEnabled;signatureAge=$d.AntivirusSignatureAge;signatureVersion=$d.AntivirusSignatureVersion;runningMode=$d.AMRunningMode}} catch {$r.errors+= 'Defender indisponível ou acesso negado'}
           try {$p=Get-MpPreference -ErrorAction Stop;$r.policies=[ordered]@{controlledFolders=$(if($null -ne $p.EnableControlledFolderAccess){[int]$p.EnableControlledFolderAccess});networkProtection=$(if($null -ne $p.EnableNetworkProtection){[int]$p.EnableNetworkProtection})}} catch {$r.errors+='Políticas de ransomware e rede indisponíveis ou acesso negado'}
           try {$r.firewall=@(Get-NetFirewallProfile -PolicyStore ActiveStore -ErrorAction Stop | ForEach-Object {[ordered]@{name=$_.Name;enabled=($_.Enabled.ToString() -eq 'True')}})} catch {$r.errors+='Firewall indisponível ou acesso negado'}
           try {$o=Get-CimInstance Win32_OperatingSystem -ErrorAction Stop;$r.updates=[ordered]@{os=$o.Caption;version=$o.Version;build=$o.BuildNumber;lastBoot=$o.LastBootUpTime.ToString('o')}} catch {$r.errors+='Versão do sistema indisponível'}
           $r|ConvertTo-Json -Depth 5 -Compress`
          	ctx, cancel := context.WithTimeout(context.Background(), 45*time.Second)
          	defer cancel()
          	cmd := exec.CommandContext(ctx, ps, "-NoProfile", "-NonInteractive", "-Command", script)
          	cmd.SysProcAttr = &syscall.SysProcAttr{HideWindow: true}
          	data, e := cmd.Output()
          	if e != nil {
          		return nil, fmt.Errorf("Não foi possível consultar segurança do Windows: %w", e)
          	}
          	var r map[string]any
          	if e = json.Unmarshal(data, &r); e != nil {
          		return nil, fmt.Errorf("Resposta inválida do Windows: %w", e)
          	}
          	return r, nil
          }
          
          // Only fixed, documented settings pages; never open a user-supplied link.
          func openSecuritySettings(page string) (bool, error) {
          	uris := map[string]string{"security": "ms-settings:windowsdefender", "updates": "ms-settings:windowsupdate"}
          	uri, ok := uris[page]
          	if !ok {
          		return false, fmt.Errorf("Página inválida")
          	}
          	root := os.Getenv("SystemRoot")
          	if root == "" {
          		return false, fmt.Errorf("SystemRoot indisponível")
          	}
          	e := exec.Command(filepath.Join(root, "explorer.exe"), uri).Start()
          	return e == nil, e
          }
          '@
