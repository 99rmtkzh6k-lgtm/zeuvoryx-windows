name: ZEUVORYX free-tool component validation
on:
  push:
    branches: [lab-help-evo025]
    paths: ['installer-lab/**','prepare_free_feed_policy.py','test_free_feed_policy.py','.github/workflows/free-tools-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Five source-policy regression rounds
        shell: pwsh
        run: |
          for ($i=0;$i -lt 5;$i++) {
            python -m unittest -v test_free_feed_policy
            if ($LASTEXITCODE -ne 0) { throw 'Feed policy test failed' }
          }
  build-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile inert fixture with distribution-signed NSIS package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
          dpkg-query -W nsis nsis-common
          makensis -VERSION
          cd installer-lab
          printf '%s\n' 'ZEUVORYX inert component test only' > payload.txt
          makensis fixture.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: internal-nsis-fixture-not-product
          path: installer-lab/zeuvoryx-installer-fixture.exe
          if-no-files-found: error
          retention-days: 1
  run-fixture:
    needs: [verify, build-fixture]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: internal-nsis-fixture-not-product
          path: fixture
      - name: Five installs and safe selective uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:LOCALAPPDATA 'ZEUVORYX-Installer-Component-EVO030'
          if (Test-Path $path) { throw 'Unexpected existing fixture directory' }
          $setup = Join-Path $PWD 'fixture/zeuvoryx-installer-fixture.exe'
          for ($i=0;$i -lt 5;$i++) {
            $p=Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0 -or !(Test-Path (Join-Path $path 'payload.txt'))) { throw 'Fixture install failed' }
            if ($i -eq 0) { Set-Content (Join-Path $path 'user-marker.txt') 'preserve' }
            if ((Get-Content (Join-Path $path 'user-marker.txt')) -ne 'preserve') { throw 'Marker lost' }
          }
          $p=Start-Process -FilePath (Join-Path $path 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Fixture uninstall failed' }
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $path 'payload.txt')) { throw 'Fixture payload remains' }
          if ((Get-Content (Join-Path $path 'user-marker.txt')) -ne 'preserve') { throw 'User marker lost on uninstall' }
          Write-Host 'NSIS fixture: five installs and non-destructive uninstall passed'
