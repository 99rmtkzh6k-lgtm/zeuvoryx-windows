

name: ZEUVORYX Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Organize project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force engine, ui, ui/assets | Out-Null

          foreach ($f in @('scanner.go','scanner_test.go','zip_test.go','pe.go','quarantine.go')) {
            if (Test-Path $f) {
              Move-Item $f engine/ -Force
            }
          }

          if (Test-Path ui.go) {
            Move-Item ui.go ui/ui.go -Force
          }
          if (Test-Path index.html) {
            Move-Item index.html ui/index.html -Force
          }

          foreach ($f in @('zeuvoryx_capa_4k.jpg','zeuvoryx_painel_4k.jpg')) {
            if (Test-Path $f) {
              Move-Item $f ui/assets/ -Force
            }
          }

          go list ./...
          if ($LASTEXITCODE -ne 0) {
            throw 'Package structure error'
          }

      - name: Run detailed tests
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          go test -v -count=1 ./...
          if ($LASTEXITCODE -ne 0) {
            throw 'Go tests failed'
          }

      - name: Build Windows EXE
        id: build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -o dist/ZEUVORYX.exe .
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows build failed'
          }
          Copy-Item signatures.sha256 dist/ -ErrorAction Stop

      - name: Upload EXE
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ZEUVORYX-Windows
          path: dist/
          if-no-files-found: error

      - name: Verify test result
        if: steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          throw 'Tests failed. Review Run detailed tests.'

