          New-Item -ItemType Directory -Force dist | Out-Null
          $key = $env:ZEUVORYX_OWNER_PUBLIC_KEY
          if ($key -and $key -notmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid owner public key' }
          $flags = '-H=windowsgui'
          if ($key) { $flags += ' -X github.com/zeuvoryx/zeuvoryx/updater.OwnerPublicKeyHex=' + $key }
          go build -trimpath -ldflags $flags -o dist/ZEUVORYX.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          Copy-Item signatures.sha256, ZEUVORYX.ico, ZEUVORYX.png dist/ -ErrorAction Stop
          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD 'dist/ZEUVORYX.exe'))
          $pe = [BitConverter]::ToInt32($bytes, 60)
          $subsystem = [BitConverter]::ToUInt16($bytes, ($pe + 24 + 68))
          if ($subsystem -ne 2) { throw 'Expected Windows GUI executable' }
          Get-FileHash dist/ZEUVORYX.exe -Algorithm SHA256
      - name: Package C2PA verifier and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $url = 'https://github.com/contentauth/c2patool/releases/download/v0.28.1/v0.28.1-x86_64-pc-windows-msvc.zip'
          Invoke-WebRequest -Uri $url -OutFile c2pa-release.zip
          $hash = (Get-FileHash c2pa-release.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'cc876f899427a01505dcaf7a9c3713217e0034b11b43259ac647d0363dc1e827') { throw 'C2PA archive hash mismatch' }
          Expand-Archive -Path c2pa-release.zip -DestinationPath c2pa-release -Force
          $tools = @(Get-ChildItem c2pa-release -Recurse -Filter c2patool.exe -File)
          if ($tools.Count -ne 1) { throw 'C2PA executable missing or ambiguous' }
          New-Item -ItemType Directory -Force dist/media-verifier | Out-Null
          Copy-Item -LiteralPath $tools[0].FullName -Destination dist/media-verifier/c2patool.exe -Force
          $legal = @(Get-ChildItem c2pa-release -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|NOTICE|COPYING)([._-][A-Za-z0-9._-]+)?$' })
          foreach ($item in $legal) {
            $dest = Join-Path 'dist/media-verifier' $item.Name
            if (Test-Path $dest) {
              if ((Get-FileHash -LiteralPath $dest).Hash -ne (Get-FileHash -LiteralPath $item.FullName).Hash) { throw 'Conflicting third-party license filenames' }
            } else { Copy-Item -LiteralPath $item.FullName -Destination $dest }
          }
          $unexpected = @(Get-ChildItem dist/media-verifier -Recurse -File | Where-Object { $_.Name -ne 'c2patool.exe' -and $_.Name -notmatch '^(LICENSE|NOTICE|COPYING)([._-][A-Za-z0-9._-]+)?$' })
          if ($unexpected.Count -gt 0) { throw 'Unexpected C2PA distribution file' }
          & (Join-Path $PWD 'dist/media-verifier/c2patool.exe') -V
          if ($LASTEXITCODE -ne 0) { throw 'C2PA runtime check failed' }
          Copy-Item zeuvoryx_brand.jpg dist/ -ErrorAction Stop
          if ((Get-FileHash dist/zeuvoryx_brand.jpg -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c0ae621b1784260b67f8f8953d9ad96ac6cb2a5c9b96cd66f3125f22ef9de754') { throw 'Unexpected branding asset in package' }
          $ini = "[.ShellClassInfo]`r`nIconResource=ZEUVORYX.ico,0`r`n"
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/desktop.ini'), $ini, [Text.Encoding]::Unicode)
          $source = @'
          [Setup]
          AppId=ZEUVORYX.Desktop.Lab303
          AppName=ZEUVORYX 3.0.5 LAB
          AppPublisher=Leonardo A Botelho
          VersionInfoCompany=Leonardo A Botelho
          VersionInfoCopyright=Copyright (C) 2026 Leonardo A Botelho
          AppVersion=3.0.5
          DefaultDirName={localappdata}\Programs\ZEUVORYX-Lab303
          DefaultGroupName=ZEUVORYX LAB
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          CloseApplications=yes
          RestartApplications=no
          UsePreviousAppDir=yes
          ArchitecturesAllowed=x64compatible
          OutputDir=installer
          OutputBaseFilename=ZEUVORYX-LAB-Setup-3.0.5
          SetupIconFile=dist\ZEUVORYX.ico
          UninstallDisplayIcon={app}\ZEUVORYX.exe
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          [Languages]
          Name: "brazilianportuguese"; MessagesFile: "compiler:Languages\BrazilianPortuguese.isl"
          [Tasks]
          Name: "desktopicon"; Description: "Criar atalho na área de trabalho"
          [Files]
          Source: "dist\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\ZEUVORYX LAB"; Filename: "{app}\ZEUVORYX.exe"; WorkingDir: "{app}"
          Name: "{autodesktop}\ZEUVORYX LAB"; Filename: "{app}\ZEUVORYX.exe"; WorkingDir: "{app}"; Tasks: desktopicon
          [Run]
          Filename: "{sys}\attrib.exe"; Parameters: "+h +s ""{app}\desktop.ini"""; Flags: runhidden waituntilterminated
          Filename: "{sys}\attrib.exe"; Parameters: "+r ""{app}"""; Flags: runhidden waituntilterminated
          Filename: "{app}\ZEUVORYX.exe"; Description: "Abrir ZEUVORYX"; Flags: nowait postinstall skipifsilent unchecked
          Filename: "{app}\ZEUVORYX.exe"; Parameters: "-updated-version={param:ZEUVORYXTARGET|}"; Flags: nowait skipifnotsilent; Check: IsSignedUpdate
          [Code]
          function IsSignedUpdate: Boolean;
          begin
            Result := ExpandConstant('{param:ZEUVORYXUPDATE|0}') = '1';
          end;
          [UninstallRun]
          Filename: "{sys}\attrib.exe"; Parameters: "-r ""{app}"""; Flags: runhidden waituntilterminated
          Filename: "{sys}\attrib.exe"; Parameters: "-h -s ""{app}\desktop.ini"""; Flags: runhidden waituntilterminated; RunOnceId: "ClearFolderIcon"
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'setup.iss'), $source, [Text.Encoding]::UTF8)
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          if (!(Test-Path 'installer/ZEUVORYX-LAB-Setup-3.0.5.exe')) { throw 'Installer missing' }
          Get-FileHash installer/ZEUVORYX-LAB-Setup-3.0.5.exe -Algorithm SHA256
      - name: Test in-place installer and preserve user data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'installer/ZEUVORYX-LAB-Setup-3.0.5.exe'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs/ZEUVORYX-Lab303'
          $config = Join-Path $env:APPDATA 'ZEUVORYX/lab305-audit'
          New-Item -ItemType Directory -Force $config | Out-Null
          $marker = Join-Path $config 'upgrade-test-marker.txt'
          Set-Content -LiteralPath $marker -Value 'preserve-test-only'
          for ($i=0; $i -lt 2; $i++) {
            $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installation failed: $($p.ExitCode)" }
            if ((Get-FileHash (Join-Path $dir 'ZEUVORYX.exe')).Hash -ne (Get-FileHash dist/ZEUVORYX.exe).Hash) { throw 'Installed binary mismatch' }
            if ((Get-Content -LiteralPath $marker) -ne 'preserve-test-only') { throw 'User data lost' }
          }
          $reg = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ZEUVORYX.Desktop.Lab303_is1'
          if (!(Test-Path $reg)) { throw 'Expected installation identity missing' }
          $entries = @(Get-ChildItem $dir -Filter 'unins*.exe')
          if ($entries.Count -ne 1) { throw 'Unexpected duplicate uninstaller' }
          Write-Host 'In-place reinstall and data preservation passed on Windows runner'
      - name: Upload LAB 3.0.5 installer and portable edition
        uses: actions/upload-artifact@v4
        with:
          name: ZEUVORYX-3.0.5-LAB-R5-Olympus-Silver-Windows-Complete
          path: |
            dist/
            installer/ZEUVORYX-LAB-Setup-3.0.5.exe
          if-no-files-found: error
