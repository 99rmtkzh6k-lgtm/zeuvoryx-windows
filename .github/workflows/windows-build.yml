          	"os/exec"
          	"path/filepath"
          	"strings"
          	"syscall"
          	"time"
          )
          
          func clamExecutable() (string, error) {
          	root := os.Getenv("ProgramFiles")
          	if !filepath.IsAbs(root) {
          		return "", fmt.Errorf("Program Files indisponível")
          	}
          	p := filepath.Join(root, "ClamAV", "clamscan.exe")
          	st, e := os.Lstat(p)
          	if e != nil || !st.Mode().IsRegular() {
          		return "", fmt.Errorf("ClamAV não instalado no diretório oficial Program Files\\ClamAV")
          	}
          	return p, nil
          }
          func clamScanFile(path string) (map[string]any, error) {
          	tool, e := clamExecutable()
          	if e != nil {
          		return nil, e
          	}
          	path, e = filepath.Abs(strings.TrimSpace(path))
          	if e != nil {
          		return nil, e
          	}
          	if strings.HasPrefix(path, `\\`) {
          		return nil, fmt.Errorf("Selecione um arquivo local")
          	}
          	st, e := os.Lstat(path)
          	if e != nil || !st.Mode().IsRegular() {
          		return nil, fmt.Errorf("Selecione um arquivo regular")
          	}
          	ctx, cancel := context.WithTimeout(context.Background(), 5*time.Minute)
          	defer cancel()
          	cmd := exec.CommandContext(ctx, tool, "--no-summary", "--", path)
          	cmd.Dir = filepath.Dir(tool)
          	cmd.SysProcAttr = &syscall.SysProcAttr{HideWindow: true}
          	out := &limitedMediaOutput{n: 1 << 20}
          	cmd.Stdout = out
          	cmd.Stderr = out
          	e = cmd.Run()
          	if ctx.Err() != nil {
          		return nil, ctx.Err()
          	}
          	code := 0
          	if e != nil {
          		if x, ok := e.(*exec.ExitError); ok {
          			code = x.ExitCode()
          		} else {
          			return nil, e
          		}
          	}
          	status := "Inconclusivo: erro do ClamAV"
          	if code == 0 {
          		status = "Nenhuma detecção reportada pelo ClamAV; não comprova segurança"
          	} else if code == 1 {
          		status = "Alerta do ClamAV: não execute o arquivo; use a central Defender para tratamento"
          	}
          	return map[string]any{"status": status, "code": code, "details": out.b.String()}, nil
          }
