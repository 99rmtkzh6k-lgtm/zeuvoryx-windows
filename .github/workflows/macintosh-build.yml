name: ZEUVORYX Macintosh 3.0.5 LAB
on:
  push:
    branches: [macintosh-3.0.5-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Test portable and scanner modules; cross-build both macOS architectures
        run: |
          set -euo pipefail
          go vet ./macintosh/... ./releaseguard ./impact ./remediation ./labcheck ./adaptive
          go test -race -count=5 ./macintosh/... ./releaseguard ./impact ./remediation ./labcheck ./adaptive
          go test -v -count=5 -run '^(TestLinkTriage|TestWikiLinkRegression)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: arm64-apple-macos13.0
          - runner: macos-15-intel
            arch: amd64
            target: x86_64-apple-macos13.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate and test Macintosh modules ten times
        run: |
          go vet ./macintosh/... ./releaseguard ./impact ./remediation ./labcheck ./adaptive
          go test -v -count=10 -shuffle=on -cover ./macintosh/... ./releaseguard ./impact ./remediation ./labcheck ./adaptive
      - name: Race and fuzz security regressions
        run: |
          go test -race -count=10 ./macintosh/... ./releaseguard ./impact ./remediation ./labcheck
          go test -run '^$' -fuzz '^FuzzSignedManifest$' -fuzztime=10s -parallel=2 ./releaseguard
          go test -run '^$' -fuzz '^FuzzSignedSnapshot$' -fuzztime=10s -parallel=2 ./impact
          go test -run '^$' -fuzz '^FuzzMacReadOnly$' -fuzztime=20s -parallel=2 ./macintosh/scanner
      - name: Repeat Windows shared-model synthetic AI benchmark
        run: go run ./cmd/adaptive-lab50 -out lab-results/adaptive-report-50m.json
      - name: Repeat ten million synthetic fraud evaluations
        env:
          ZEUVORYX_STRESS: '1'
        run: go test -v -run '^TestSyntheticFraudMillion$' -count=10 ./macintosh/portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Macintosh-QA-${{ matrix.arch }}
          path: lab-results/
          if-no-files-found: warn
      - name: Compile native app and read-only engine
        env:
          GOARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          APP="dist/ZEUVORYX Macintosh.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          test "$(shasum -a 256 zeuvoryx_brand.jpg | cut -d ' ' -f 1)" = c0ae621b1784260b67f8f8953d9ad96ac6cb2a5c9b96cd66f3125f22ef9de754
          cp zeuvoryx_brand.jpg "$APP/Contents/Resources/"
          cp macintosh/Info.plist "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = 3.0.5
          grep -Fq '3.0.5 LAB BETA' macintosh/App.swift
          go build -trimpath -o "$APP/Contents/MacOS/zeuvoryx-engine" ./macintosh/cmd/zeuvoryx
          swiftc -swift-version 5 -parse-as-library -O -target "$TARGET" macintosh/App.swift -o "$APP/Contents/MacOS/ZEUVORYX"
          codesign --force --sign - "$APP/Contents/MacOS/zeuvoryx-engine"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$("$APP/Contents/MacOS/zeuvoryx-engine" version)" = 3.0.5
          "$APP/Contents/MacOS/zeuvoryx-engine" selftest
          "$APP/Contents/MacOS/zeuvoryx-engine" link "https://example.org/" > link-smoke.json
          python3 -c 'import json; r=json.load(open("link-smoke.json")); assert r["host"]=="example.org" and r["signals"]==[]'
          "$APP/Contents/MacOS/zeuvoryx-engine" link "https://example.org/?%72edirect=x" > link-smoke.json
          python3 -c 'import json; r=json.load(open("link-smoke.json")); assert len(r["signals"])==1'
          mkdir -p "$RUNNER_TEMP/z-fixture"
          printf 'harmless' > "$RUNNER_TEMP/z-fixture/ordinary.txt"
          "$APP/Contents/MacOS/zeuvoryx-engine" scan "$RUNNER_TEMP/z-fixture" > smoke.json
          python3 -c 'import json; r=json.load(open("smoke.json")); assert r["files"]==1 and not r["partial"] and not r["findings"]'
          file "$APP/Contents/MacOS/"*
      - name: Package lab DMG
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p package
          hdiutil create -volname "ZEUVORYX Macintosh LAB" -srcfolder dist -format UDZO "package/ZEUVORYX-Macintosh-3.0.5-LAB-$ARCH.dmg"
          hdiutil verify "package/ZEUVORYX-Macintosh-3.0.5-LAB-$ARCH.dmg"
          cd package
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZEUVORYX-Macintosh-3.0.5-LAB-${{ matrix.arch }}
          path: package/
          if-no-files-found: error
 ./macintosh/portable
          for arch in amd64 arm64; do GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o /tmp/zeuvoryx-$arch ./macintosh/cmd/zeuvoryx; done
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: arm64-apple-macos13.0
          - runner: macos-15-intel
            arch: amd64
            target: x86_64-apple-macos13.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
