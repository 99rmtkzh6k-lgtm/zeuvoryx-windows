          html,body{width:100%;height:100%;overflow:hidden}body{font-size:14px}.shell{height:100vh;min-height:0;grid-template-columns:184px minmax(0,1fr);overflow:hidden}aside{padding:14px 10px;overflow-y:auto;min-height:0}.brand{font-size:16px;gap:7px}.brand svg{width:30px;height:34px}.tag{margin:5px 0 14px}.nav{gap:4px}.nav button{padding:9px 10px;font-size:13px}.note{margin-top:10px;font-size:11px}.zeus-art{height:110px;margin:10px 0 4px}main{padding:14px 16px;overflow-y:auto;min-height:0;min-width:0}header{margin-bottom:12px;gap:8px}h1{font-size:22px}.hero{padding:14px;gap:12px;border-radius:14px;margin-bottom:12px}.hero>div:last-child{min-width:0;flex:1}.hero h2{font-size:19px}.hero p{margin:5px 0 9px;font-size:13px}.ring,.ring svg{width:70px;height:70px}.ring span{font-size:25px}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions button{padding:9px 11px;font-size:13px}.mode-help{font-size:11px!important;color:var(--muted);margin:8px 0 0!important}.grid{gap:8px;margin-bottom:10px}.card{padding:12px;border-radius:12px;min-width:0}.metric{font-size:24px;margin-top:5px}.label{font-size:10px}.chart{margin-bottom:10px}.chart svg{height:90px;margin-top:6px}.chart .sub{font-size:11px}.speed{margin-top:3px}.pill{padding:6px 8px;font-size:11px}.sub{margin-top:4px}.muted{font-size:12px}footer{margin-top:9px;font-size:11px}#msg{min-height:0;margin-top:6px}.media-field{max-width:100%}dialog{width:min(92vw,500px)}
