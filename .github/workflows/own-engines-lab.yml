name: ZEUVORYX LAB - Five own engine revisions
on:
  push:
    branches: [windows-3.0.14-audit-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Static validation
        run: go vet ./scriptguard ./behaviorwatch ./changeguard ./auditmetrics ./scopeprogress
      - name: Five regression cycles
        run: go test -v -count=5 ./scriptguard ./behaviorwatch ./changeguard ./auditmetrics ./scopeprogress
      - name: Measure actual Unicode allocation and throughput
        run: go test -run '^$' -bench '^BenchmarkUTF16Streaming315$' -benchmem -count=5 ./scriptguard
