<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"><style>body{background:#10182b;color:#f2f5ff;text-align:center;font:16px system-ui;margin:8px}canvas{background:#070b17;border:2px solid #607ca9;max-width:100%;max-height:460px}button{background:#22385b;color:white;border:1px solid #90a7c9;border-radius:7px;margin:4px;padding:10px;font:inherit;cursor:pointer}p{margin:8px}</style></head><body><h2>Labirinto — Pacman-like</h2><p id="score">Pontos: 0</p><canvas id="board" width="360" height="280"></canvas><div><button id="left">◀</button><button id="up">▲</button><button id="down">▼</button><button id="right">▶</button><button id="restart">Reiniciar</button></div><script>
const grid=['###############','#.............#','#.###.#.###.#.#','#.....#.....#.#','###.#...###.#.#','#...#.###.....#','#.#.........#.#','#.###.###.###.#','#.....#.......#','#.###...###.#.#','###############'];const c=document.getElementById('board'),g=c.getContext('2d'),S=24;let pellets,p,ghosts,dir,score,over,win,t=0,timer;const valid=(x,y)=>grid[y]?.[x]==='.';const key=(x,y)=>x+','+y;function reset(){pellets=new Set();grid.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='.')pellets.add(key(x,y))}));p={x:1,y:1};ghosts=[{x:13,y:9},{x:7,y:5}];dir=[0,0];score=0;over=false;win=false;t=0;pellets.delete(key(1,1));draw()}
function step(){if(over||win)return;let [a,b]=dir;if(valid(p.x+a,p.y+b)){p.x+=a;p.y+=b;if(pellets.delete(key(p.x,p.y)))score+=10}if(ghosts.some(q=>q.x===p.x&&q.y===p.y))over=true;if(!over&&++t%3===0)for(const q of ghosts){let opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>valid(q.x+a,q.y+b));if(opts.length){opts.sort((u,v)=>Math.abs(q.x+u[0]-p.x)+Math.abs(q.y+u[1]-p.y)-Math.abs(q.x+v[0]-p.x)-Math.abs(q.y+v[1]-p.y));let [a,b]=opts[Math.random()<.7?0:Math.floor(Math.random()*opts.length)];q.x+=a;q.y+=b}}if(ghosts.some(q=>q.x===p.x&&q.y===p.y))over=true;win=!over&&!pellets.size;draw()}
function dot(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x*S+S/2,y*S+S/2,r,0,Math.PI*2);g.fill()}function draw(){g.clearRect(0,0,c.width,c.height);grid.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='#'){g.fillStyle='#334b86';g.fillRect(x*S,y*S,S-1,S-1)}else if(pellets.has(key(x,y)))dot(x,y,2,'#eee')}));dot(p.x,p.y,9,'#facc15');ghosts.forEach((q,i)=>dot(q.x,q.y,9,i?'#ec4899':'#ef4444'));document.getElementById('score').textContent='Pontos: '+score+(over?' · Fim de jogo':win?' · Vitória!':'')}
const controls={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};for(const [id,k] of [['left','ArrowLeft'],['right','ArrowRight'],['up','ArrowUp'],['down','ArrowDown']])document.getElementById(id).onclick=()=>{dir=controls[k];step()};addEventListener('keydown',e=>{if(controls[e.key]){e.preventDefault();dir=controls[e.key];step()}});document.getElementById('restart').onclick=reset;reset();timer=setInterval(step,180);addEventListener('pagehide',()=>clearInterval(timer),{once:true});</script></body></html>
