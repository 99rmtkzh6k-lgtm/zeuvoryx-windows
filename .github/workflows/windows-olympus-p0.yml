name: ZEUVORYX 3.0.23 LAB - P0 scan finalization
on:
  push:
    branches: [lab-integracao-p0-20261126, lab-familia-botelho-zumbis]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  module-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Five module regression cycles
        run: go test -count=5 ./scriptguard ./behaviorwatch ./changeguard ./auditmetrics ./scopeprogress ./adaptive ./signatureav ./scanretry ./scanplan
      - name: One hundred inventory and coverage regression cycles
        run: go test -count=100 -run '^TestP0InventoryCompleteness322$' ./scopeprogress
  windows-build:
    uses: ./.github/workflows/windows-build.yml
