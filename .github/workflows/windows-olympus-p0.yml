name: ZEUVORYX 3.0.23 LAB - P0 scan finalization
on:
  push:
    branches: [lab-integracao-p0-20261126, fix-build39-relatorio-jogos, lab-arcade-nerd-build48, lab-updater-build49, lab-updater-build49-check4]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Validate only; set false ONLY with explicit owner authorization to build LAB packages'
        type: boolean
        required: true
        default: true
permissions:
  contents: read
  actions: read
jobs:
  module-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Five module regression cycles
        run: go test -count=5 ./scriptguard ./behaviorwatch ./changeguard ./auditmetrics ./scopeprogress ./adaptive ./signatureav ./scanretry ./scanplan
      - name: One hundred inventory and coverage regression cycles
        run: go test -count=100 -run '^TestP0InventoryCompleteness322$' ./scopeprogress
  windows-build:
    needs: module-regression
    uses: ./.github/workflows/windows-build.yml
    with:
      validation_only: ${{ github.event_name != 'workflow_dispatch' || inputs.validation_only != false }}
      validation_suffix: ${{ github.ref == 'refs/heads/lab-updater-build49-check4' && '-build49-check4-pass1' || github.ref == 'refs/heads/lab-updater-build49' && '-build49-check1' || github.ref == 'refs/heads/lab-arcade-nerd-build48' && '-build48-check1' || (github.ref == 'refs/heads/fix-build39-relatorio-jogos' && '-check1' || '') }}
  module-regression-pass2:
    needs: windows-build
    if: github.ref == 'refs/heads/fix-build39-relatorio-jogos' || github.ref == 'refs/heads/lab-arcade-nerd-build48' || github.ref == 'refs/heads/lab-updater-build49' || github.ref == 'refs/heads/lab-updater-build49-check4'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Five module regression cycles
        run: go test -count=5 ./scriptguard ./behaviorwatch ./changeguard ./auditmetrics ./scopeprogress ./adaptive ./signatureav ./scanretry ./scanplan
      - name: One hundred inventory and coverage regression cycles
        run: go test -count=100 -run '^TestP0InventoryCompleteness322$' ./scopeprogress
  windows-build-pass2:
    needs: module-regression-pass2
    if: github.ref == 'refs/heads/fix-build39-relatorio-jogos' || github.ref == 'refs/heads/lab-arcade-nerd-build48' || github.ref == 'refs/heads/lab-updater-build49' || github.ref == 'refs/heads/lab-updater-build49-check4'
    uses: ./.github/workflows/windows-build.yml
    with:
      validation_only: ${{ github.event_name != 'workflow_dispatch' || inputs.validation_only != false }}
      validation_suffix: ${{ github.ref == 'refs/heads/lab-updater-build49-check4' && '-build49-check4-pass2' || github.ref == 'refs/heads/lab-updater-build49' && '-build49-check2' || github.ref == 'refs/heads/lab-arcade-nerd-build48' && '-build48-check2' || '-check2' }}
  module-regression-pass3:
    needs: windows-build-pass2
    if: github.ref == 'refs/heads/fix-build39-relatorio-jogos' || github.ref == 'refs/heads/lab-arcade-nerd-build48' || github.ref == 'refs/heads/lab-updater-build49' || github.ref == 'refs/heads/lab-updater-build49-check4'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Five module regression cycles
        run: go test -count=5 ./scriptguard ./behaviorwatch ./changeguard ./auditmetrics ./scopeprogress ./adaptive ./signatureav ./scanretry ./scanplan
      - name: One hundred inventory and coverage regression cycles
        run: go test -count=100 -run '^TestP0InventoryCompleteness322$' ./scopeprogress
  windows-build-pass3:
    needs: module-regression-pass3
    if: github.ref == 'refs/heads/fix-build39-relatorio-jogos' || github.ref == 'refs/heads/lab-arcade-nerd-build48' || github.ref == 'refs/heads/lab-updater-build49' || github.ref == 'refs/heads/lab-updater-build49-check4'
    uses: ./.github/workflows/windows-build.yml
    with:
      validation_only: ${{ github.event_name != 'workflow_dispatch' || inputs.validation_only != false }}
      validation_suffix: ${{ github.ref == 'refs/heads/lab-updater-build49-check4' && '-build49-check4-pass3' || github.ref == 'refs/heads/lab-updater-build49' && '-build49-check3' || github.ref == 'refs/heads/lab-arcade-nerd-build48' && '-build48-check3' || '-check3' }}
