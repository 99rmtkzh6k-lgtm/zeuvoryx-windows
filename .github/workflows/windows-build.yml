          func TestSnapshotRoundtrip(t *testing.T) {
          	p := filepath.Join(t.TempDir(), "intel", "snapshot.json")
          	v := newIntelSnapshot()
          	v.Hashes[strings.Repeat("a", 64)] = "test"
          	v.URLs["https://example.invalid/a"] = true
          	v.Updated = time.Now()
          	if e := saveSnapshot(p, v); e != nil {
