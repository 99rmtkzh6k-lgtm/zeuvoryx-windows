name: ZEUVORYX full scan power component validation
on:
  push:
    branches: [lab-help-evo025]
    paths: ['scan_power_windows.go','scan_power_windows_test.go','prepare_scan_power.py','.github/workflows/scan-power-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  power:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Five repetitions of request lifecycle
        run: go test -v -count=5 scan_power_windows.go scan_power_windows_test.go
      - name: Verify single injection into full scan
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from prepare_scan_power import transform; s=Path('main.go').read_text(encoding='utf-8-sig'); out=transform(s); assert out.count('beginFullScanPower()')==1; assert 'defer releasePower()' in out"
