          package engine
          
          import (
          	"context"
          	"encoding/binary"
          	"io"
          	"strings"
          	"unicode/utf16"
          )
          
          type guardedReader struct {
          	ctx context.Context
          	r   io.Reader
          }
          
          func (g guardedReader) Read(p []byte) (int, error) {
          	if e := g.ctx.Err(); e != nil {
          		return 0, e
          	}
          	return g.r.Read(p)
          }
          
          // A BOM-marked Unicode script must not bypass textual heuristics just because it contains NUL bytes.
          func normalizeScriptSample(data []byte) []byte {
          	if len(data) < 2 {
          		return data
          	}
          	var order binary.ByteOrder
          	switch {
          	case data[0] == 0xff && data[1] == 0xfe:
          		order = binary.LittleEndian
          	case data[0] == 0xfe && data[1] == 0xff:
          		order = binary.BigEndian
          	default:
          		return data
          	}
          	if len(data) >= 4 && ((data[2] == 0 && data[3] == 0) || (data[0] == 0 && data[1] == 0)) {
          		return data
          	}
          	u := make([]uint16, (len(data)-2)/2)
          	for i := range u {
          		u[i] = order.Uint16(data[2+i*2:])
          	}
          	return []byte(strings.TrimPrefix(string(utf16.Decode(u)), "\ufeff"))
          }
