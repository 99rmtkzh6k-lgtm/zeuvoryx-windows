name: ZEUVORYX 2.6 Olympus Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Organize project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force engine, ui, ui/assets | Out-Null
          foreach ($f in @('scanner.go','scanner_test.go','zip_test.go','pe.go','quarantine.go')) {
            if (Test-Path $f) { Move-Item $f engine/ -Force }
          }
          if (Test-Path ui.go) { Move-Item ui.go ui/ui.go -Force }
          if (Test-Path index.html) { Move-Item index.html ui/index.html -Force }
          foreach ($f in @('zeuvoryx_capa_4k.jpg','zeuvoryx_painel_4k.jpg')) {
            if (Test-Path $f) { Move-Item $f ui/assets/ -Force }
          }
      - name: Optimize scanner and add quick scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = @'
          from pathlib import Path
          import re
          
          def replace_once(s, old, new):
              if s.count(old) != 1: raise RuntimeError('Unexpected source: '+old[:90])
              return s.replace(old,new,1)
          
          def patch_scanner(s):
              a=s.index('\t// Hash the complete file')
              b=s.index('\tvar found []Finding', a)
              s=s[:a]+'''\t// Capture the heuristic prefix and compute the whole-file hash in a single pass.
          \th := sha256.New()
          \tlimit := s.MaxFileBytes
          \tif limit <= 0 { limit = 32 << 20 }
          \tb, e := io.ReadAll(io.TeeReader(io.LimitReader(f, limit), h))
          \tif e != nil { return nil, e }
          \tif _, e = io.Copy(h, f); e != nil { return nil, e }
          \thash := hex.EncodeToString(h.Sum(nil))
          '''+s[b:]
              s=replace_once(s, 'lower := strings.ToLower(string(data))', 'lower := ""\n\tif textSample(data) { lower = strings.ToLower(string(data)) }')
              s=replace_once(s, 'if bytes.Contains(data, []byte(', 'if len(data) <= 128 && bytes.Equal(bytes.TrimSpace(data), []byte(')
              s += r'''
          // Text rules must not treat arbitrary machine code as a script.
          func textSample(data []byte) bool {
              if len(data) >= 2 && data[0] == 'M' && data[1] == 'Z' { return false }
              n := len(data); if n > 8192 { n = 8192 }; if n == 0 { return true }
              controls := 0
              for _, b := range data[:n] { if b == 0 { return false }; if b < 32 && b != 9 && b != 10 && b != 13 && b != 12 { controls++ } }
              return controls*20 <= n
          }
          '''
              return s
          
          def patch_main(s):
              a=s.index('func (s *State) scanRoots(')
              b=s.index('func (s *State) fullScan(',a)
              s=s[:a]+'''// scanRoots uses a bounded worker pool instead of a sequential per-file loop.
          func (s *State) scanRoots(ctx context.Context, roots []string, self string, progress func(int, int64)) engine.Report {
              r := engine.Report{Root: strings.Join(roots, "; "), Started: time.Now(), Findings: []engine.Finding{}}
              var mu sync.Mutex
              var wg sync.WaitGroup
              jobs := make(chan string, 32)
              addError := func(path string, err error) {
                  mu.Lock(); defer mu.Unlock()
                  r.Skipped++
                  if len(r.Errors) < 30 { r.Errors = append(r.Errors, path+": "+err.Error()) }
              }
              workers := runtime.NumCPU()
              if workers > 4 { workers = 4 }
              if workers < 1 { workers = 1 }
              lastProgress := time.Time{}
              for i := 0; i < workers; i++ {
                  wg.Add(1)
                  go func() {
                      defer wg.Done()
                      for path := range jobs {
                          if ctx.Err() != nil { return }
                          info, err := os.Lstat(path)
                          if err != nil { addError(path, err); continue }
                          if !info.Mode().IsRegular() { mu.Lock(); r.Skipped++; mu.Unlock(); continue }
                          one, err := s.scanner.Scan(ctx, path, nil)
                          if err != nil { addError(path, err); continue }
                          if one.Cancelled { continue }
                          mu.Lock()
                          r.Files += one.Files; r.Bytes += one.Bytes; r.Skipped += one.Skipped
                          r.Findings = append(r.Findings, one.Findings...)
                          if progress != nil && time.Since(lastProgress) >= 200*time.Millisecond {
                              progress(r.Files, r.Bytes); lastProgress = time.Now()
                          }
                          mu.Unlock()
                      }
                  }()
              }
              for _, root := range roots {
                  if ctx.Err() != nil { break }
                  err := filepath.WalkDir(root, func(path string, d os.DirEntry, err error) error {
                      if ctx.Err() != nil { return ctx.Err() }
                      if err != nil { addError(path, err); return nil }
                      if s.quarantine.IsQuarantined(path) { if d.IsDir() { return filepath.SkipDir }; return nil }
                      if d.Type()&os.ModeSymlink != 0 { mu.Lock(); r.Skipped++; mu.Unlock(); return nil }
                      if d.IsDir() { return nil }
                      if !d.Type().IsRegular() || samePath(path,self) { mu.Lock(); r.Skipped++; mu.Unlock(); return nil }
                      select { case jobs <- path: return nil; case <-ctx.Done(): return ctx.Err() }
                  })
                  if err != nil && ctx.Err() == nil { addError(root, err) }
              }
              close(jobs); wg.Wait()
              r.Cancelled = ctx.Err() != nil; r.Finished = time.Now()
              if progress != nil { progress(r.Files,r.Bytes) }
              sort.SliceStable(r.Findings, func(i,j int) bool { return r.Findings[i].Risk > r.Findings[j].Risk })
              return r
          }
          
          // Quick scan intentionally covers selected high-risk user locations, not the whole disk.
          func (s *State) quickScan(ctx context.Context, progress func(int,int64)) (engine.Report,error) {
              home,err:=os.UserHomeDir(); if err!=nil{return engine.Report{},err}
              candidates:=[]string{filepath.Join(home,"Downloads"),filepath.Join(home,"Desktop"),os.TempDir()}
              if v:=os.Getenv("APPDATA");v!=""{candidates=append(candidates,filepath.Join(v,"Microsoft","Windows","Start Menu","Programs","Startup"))}
              if v:=os.Getenv("ProgramData");v!=""{candidates=append(candidates,filepath.Join(v,"Microsoft","Windows","Start Menu","Programs","Startup"))}
              var roots []string
              seen:=map[string]bool{}
              for _,p:=range candidates{p=filepath.Clean(p);key:=strings.ToLower(p);if seen[key]{continue};seen[key]=true; if info,e:=os.Lstat(p);e==nil&&info.IsDir()&&info.Mode()&os.ModeSymlink==0{roots=append(roots,p)}}
              if len(roots)==0{return engine.Report{},fmt.Errorf("nenhuma pasta de análise rápida acessível")}
              self,_:=os.Executable();return s.scanRoots(ctx,roots,self,progress),nil
          }
          
          '''+s[b:]
              s=replace_once(s,'if automatic {\n\t\t\trep, e = s.fullScan(ctx, progress)','if automatic && path == ":quick:" {\n\t\t\trep, e = s.quickScan(ctx, progress)\n\t\t} else if automatic {\n\t\t\trep, e = s.fullScan(ctx, progress)')
              s=replace_once(s,'"auto",\n\t\ttrue,','"auto",\n\t\tfalse,')
              return s
          
          if __name__=='__main__':
              for path,fn in [(Path('engine/scanner.go'),patch_scanner),(Path('main.go'),patch_main)]:
                  path.write_text(fn(path.read_text(encoding='utf-8')), encoding='utf-8')
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'patch_scan.py'), $source, (New-Object System.Text.UTF8Encoding($false)))
          python patch_scan.py
          if ($LASTEXITCODE -ne 0) { throw 'Source patch failed' }
          gofmt -w main.go engine/scanner.go
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          $source = @'
          package main
          import("context";"crypto/sha256";"encoding/hex";"os";"path/filepath";"testing";"github.com/zeuvoryx/zeuvoryx/engine")
          func TestOlympusParallelAndFullHash(t *testing.T) {
           root:=t.TempDir();q:=filepath.Join(root,"q");if e:=os.Mkdir(q,0700);e!=nil{t.Fatal(e)}
           data:=make([]byte,131072);for i:=range data{data[i]=byte(i%251)}
           for _,name:=range []string{"one.bin","two.bin","three.bin","self.bin","q/excluded.bin"}{if e:=os.WriteFile(filepath.Join(root,name),data,0600);e!=nil{t.Fatal(e)}}
           sc:=engine.New();sc.MaxFileBytes=1024;sum:=sha256.Sum256(data);sc.IOC[hex.EncodeToString(sum[:])]="Full hash regression"
           st:=&State{scanner:sc,quarantine:&engine.Quarantine{Dir:q}}
           n:=0;r:=st.scanRoots(context.Background(),[]string{root},filepath.Join(root,"self.bin"),func(i int,b int64){n=i})
           if r.Files!=3||n!=3||r.Bytes!=3*int64(len(data))||len(r.Findings)!=3||r.Cancelled{t.Fatalf("unexpected coverage: %+v, %d",r,n)}
           for _,hit:=range r.Findings{if hit.SHA256!=hex.EncodeToString(sum[:]){t.Fatal("incomplete file hash")}}
           ctx,cancel:=context.WithCancel(context.Background());cancel();r=st.scanRoots(ctx,[]string{root},"",nil);if !r.Cancelled||r.Files!=0{t.Fatalf("cancellation failed: %+v",r)}
          }
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'olympus_test.go'), $source, (New-Object System.Text.UTF8Encoding($false)))
          gofmt -w olympus_test.go
          if ($LASTEXITCODE -ne 0) { throw 'Test formatting failed' }
      - name: Prepare modern desktop and icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $source = @'
          package main
          
          import (
          	"context"
              "sync"
              "sync/atomic"
          	"bytes"
          	"os/exec"
          	"path/filepath"
          	"time"
          	"crypto/sha256"
          	_ "embed"
          	"encoding/hex"
          	"encoding/json"
          	"fmt"
          	"io"
          	"os"
          	"runtime"
          	"strings"
          	"syscall"
          	"unsafe"
          
          	webview "github.com/jchv/go-webview2"
          )
          
          //go:embed desktop.html
          var desktopHTML string
          
          var desktopKernel = syscall.NewLazyDLL("kernel32.dll")
          var desktopUser = syscall.NewLazyDLL("user32.dll")
          
          func desktopFixedRoots(ctx context.Context) ([]string, error) {
          	if err := ctx.Err(); err != nil {
          		return nil, err
          	}
          	mask, _, e := desktopKernel.NewProc("GetLogicalDrives").Call()
          	if mask == 0 {
          		return nil, fmt.Errorf("GetLogicalDrives: %v", e)
          	}
          	var roots []string
          	for i := 0; i < 26; i++ {
          		if mask&(1<<i) == 0 {
          			continue
          		}
          		root := fmt.Sprintf("%c:\\", 'A'+i)
          		p, _ := syscall.UTF16PtrFromString(root)
          		kind, _, _ := desktopKernel.NewProc("GetDriveTypeW").Call(uintptr(unsafe.Pointer(p)))
          		if kind == 3 {
          			roots = append(roots, root)
          		}
          	}
          	if len(roots) == 0 {
          		return nil, fmt.Errorf("Nenhum disco local encontrado")
          	}
          	return roots, nil
          }
          
          func desktopError(text string) {
          	p, _ := syscall.UTF16PtrFromString(text)
          	t, _ := syscall.UTF16PtrFromString("ZEUVORYX")
          	desktopUser.NewProc("MessageBoxW").Call(0, uintptr(unsafe.Pointer(p)), uintptr(unsafe.Pointer(t)), 16)
          }
          
          func runDesktop(s *State, _ bool) {
          	runtime.LockOSThread()
          	defer runtime.UnlockOSThread()
          	w := webview.NewWithOptions(webview.WebViewOptions{Debug: false, AutoFocus: true, WindowOptions: webview.WindowOptions{Title: "ZEUVORYX | Olympus 2.6", Width: 920, Height: 650, Center: true}})
          	if w == nil {
          		desktopError("Não foi possível inicializar a interface. Verifique a instalação do Microsoft WebView2 Runtime.")
          		return
          	}
          	defer w.Destroy()
          	defer func() {
          		s.mu.Lock()
          		if s.cancel != nil {
          			s.cancel()
          		}
          		s.mu.Unlock()
          	}()
          	w.SetSize(540, 400, webview.HintMin)
              desktopUser.NewProc("ShowWindow").Call(uintptr(w.Window()), 3)
              var monitorEnabled atomic.Bool
              monitorCtx, stopMonitor := context.WithCancel(context.Background())
              defer stopMonitor()
              go func() {
                  ticker := time.NewTicker(5*time.Minute); defer ticker.Stop()
                  for { select {
                  case <-monitorCtx.Done(): return
                  case <-ticker.C:
                      if !monitorEnabled.Load() { continue }
                      s.mu.Lock(); ready := !s.running && len(s.report.Findings)==0; s.mu.Unlock()
                      if ready { s.startScan(":quick:", true) }
                  } }
              }()
              var cleanupMu sync.Mutex
              var cleanupPlan []tempCandidate
          	bind := func(name string, fn any) bool {
          		if e := w.Bind(name, fn); e != nil {
          			desktopError(e.Error())
          			return false
          		}
          		return true
          	}
          	if !bind("getScanState", func() map[string]any {
          		s.mu.Lock()
          		defer s.mu.Unlock()
          		return map[string]any{"running": s.running, "files": s.files, "bytes": s.bytes, "report": s.report, "done": !s.report.Finished.IsZero(), "error": s.err, "monitor": monitorEnabled.Load()}
          	}) {
          		return
          	}
          	if !bind("minimizeApp", func() bool { w.Dispatch(func(){desktopUser.NewProc("ShowWindow").Call(uintptr(w.Window()),6)}); return true }) { return }
              if !bind("setMonitor", func(enabled bool) bool { monitorEnabled.Store(enabled); return enabled }) { return }
              if !bind("previewCleanup", func() (map[string]any,error) {
                  s.mu.Lock(); defer s.mu.Unlock(); if s.running { return nil,fmt.Errorf("Aguarde a varredura") }
                  cleanupMu.Lock(); defer cleanupMu.Unlock()
                  p,e:=planTemp(os.TempDir(),time.Now()); if e!=nil{return nil,e}; cleanupPlan=p
                  var bytes int64; for _,v:=range p { bytes+=v.info.Size() }; return map[string]any{"files":len(p),"bytes":bytes},nil
              }) { return }
              if !bind("applyCleanup", func() (map[string]any,error) {
                  s.mu.Lock(); defer s.mu.Unlock(); if s.running { return nil,fmt.Errorf("Aguarde a varredura") }
                  cleanupMu.Lock(); defer cleanupMu.Unlock(); p:=cleanupPlan; cleanupPlan=nil
                  n,b,skip:=cleanTemp(p);return map[string]any{"files":n,"bytes":b,"skipped":skip},nil
              }) { return }
              if !bind("deleteQuarantined", func(id string) (bool,error) {
                  s.mu.Lock(); defer s.mu.Unlock(); if s.running { return false,fmt.Errorf("Aguarde a varredura") }
                  e:=deleteIsolated(s.quarantine.Dir,id);return e==nil,e
              }) { return }
              if !bind("assessLink", assessLink) { return }
              if !bind("windowsSecurityAudit", windowsSecurityAudit) { return }
              if !bind("openSecuritySettings", openSecuritySettings) { return }
              if !bind("startScan", func() bool { return s.startScan("", true) }) {
          		return
          	}
          	if !bind("startQuickScan", func() bool { return s.startScan(":quick:", true) }) { return }
          	if !bind("chooseVideo", chooseVideo) { return }
          	if !bind("verifyVideo", verifyVideo) { return }
          	if !bind("stopScan", func() bool {
          		s.mu.Lock()
          		defer s.mu.Unlock()
          		if s.cancel != nil {
          			s.cancel()
          			return true
          		}
          		return false
          	}) {
          		return
          	}
          	if !bind("quarantineList", s.quarantine.List) {
          		return
          	}
          	if !bind("isolate", func(path string) (bool, error) {
          		s.mu.Lock()
          		defer s.mu.Unlock()
          		if s.running {
          			return false, fmt.Errorf("Aguarde a varredura")
          		}
          		if strings.Contains(path, " :: ") {
          			return false, fmt.Errorf("Entrada interna de ZIP")
          		}
          		var hash string
          		for _, f := range s.report.Findings {
          			if f.Path == path {
          				hash = f.SHA256
          				break
          			}
          		}
          		if hash == "" {
          			return false, fmt.Errorf("Alerta inválido; refaça a análise")
          		}
          		info, e := os.Lstat(path)
          		if e != nil {
          			return false, e
          		}
          		if !info.Mode().IsRegular() {
          			return false, fmt.Errorf("Arquivo não regular")
          		}
          		f, e := os.Open(path)
          		if e != nil {
          			return false, e
          		}
          		h := sha256.New()
          		_, e = io.Copy(h, f)
          		ce := f.Close()
          		if e != nil {
          			return false, e
          		}
          		if ce != nil {
          			return false, ce
          		}
          		if !strings.EqualFold(hex.EncodeToString(h.Sum(nil)), hash) {
          			return false, fmt.Errorf("Arquivo alterado desde a análise")
          		}
          		_, e = s.quarantine.Add(path)
                  if e==nil {
                      findings:=s.report.Findings[:0:0]
                      for _,f:=range s.report.Findings { if f.Path!=path { findings=append(findings,f) } }
                      s.report.Findings=findings
                  }
                  return e == nil, e
          	}) {
          		return
          	}
          	if !bind("restoreItem", func(id string) (bool, error) {
          		s.mu.Lock()
          		defer s.mu.Unlock()
          		if s.running {
          			return false, fmt.Errorf("Aguarde a varredura")
          		}
          		e := s.quarantine.Restore(id)
          		return e == nil, e
          	}) {
          		return
          	}
          	if !bind("exportReport", func() (string, error) {
          		s.mu.Lock()
          		if s.running || s.report.Finished.IsZero() {
          			s.mu.Unlock()
          			return "", fmt.Errorf("Relatório ainda indisponível")
          		}
          		r := s.report
          		s.mu.Unlock()
          		home, e := os.UserHomeDir()
          		if e != nil {
          			return "", e
          		}
          		f, e := os.CreateTemp(home, "zeuvoryx-report-*.json")
          		if e != nil {
          			return "", e
          		}
          		name := f.Name()
          		e = json.NewEncoder(f).Encode(r)
          		ce := f.Close()
          		if e == nil {
          			e = ce
          		}
          		if e != nil {
          			os.Remove(name)
          			return "", e
          		}
          		return name, nil
          	}) {
          		return
          	}
          	w.SetHtml(desktopHTML)
          	w.Run()
          }
          
          // chooseVideo opens the standard Windows file picker; no user text is evaluated as a command.
          func chooseVideo() (string,error) {
              ps := filepath.Join(os.Getenv("SystemRoot"),"System32","WindowsPowerShell","v1.0","powershell.exe")
              script := `[Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false); Add-Type -AssemblyName System.Windows.Forms; $d = New-Object System.Windows.Forms.OpenFileDialog; $d.Filter = 'Vídeos MP4/MOV|*.mp4;*.mov|Todos os arquivos|*.*'; $d.CheckFileExists = $true; if ($d.ShowDialog() -eq [System.Windows.Forms.DialogResult]::OK) { [Console]::WriteLine($d.FileName) }; $d.Dispose()`
              ctx,cancel:=context.WithTimeout(context.Background(),5*time.Minute); defer cancel()
              cmd:=exec.CommandContext(ctx,ps,"-NoProfile","-STA","-Command",script)
              cmd.SysProcAttr=&syscall.SysProcAttr{HideWindow:true}
              b,e:=cmd.Output(); if e!=nil{return "",e}; return strings.TrimSpace(string(b)),nil
          }
          
          type limitedMediaOutput struct { b bytes.Buffer; n int }
          func (w *limitedMediaOutput) Write(p []byte)(int,error){
              if len(p)>w.n { return 0,fmt.Errorf("relatório excedeu o limite de segurança") }
              n,e:=w.b.Write(p);w.n-=n;return n,e
          }
          
          // C2PA reads signed provenance; absence or presence is not a deepfake verdict.
          func verifyVideo(path string) (map[string]any,error) {
              path,e:=filepath.Abs(strings.TrimSpace(path));if e!=nil{return nil,e}
              ext:=strings.ToLower(filepath.Ext(path));if ext!=".mp4"&&ext!=".mov" {return nil,fmt.Errorf("selecione um vídeo MP4 ou MOV")}
              st,e:=os.Lstat(path);if e!=nil{return nil,e};if !st.Mode().IsRegular(){return nil,fmt.Errorf("arquivo não regular")}
              exe,e:=os.Executable();if e!=nil{return nil,e}
              tool:=filepath.Join(filepath.Dir(exe),"media-verifier","c2patool.exe")
              if st,e:=os.Stat(tool);e!=nil||!st.Mode().IsRegular(){return nil,fmt.Errorf("verificador C2PA não instalado; reinstale o pacote completo")}
              ctx,cancel:=context.WithTimeout(context.Background(),3*time.Minute);defer cancel()
              cmd:=exec.CommandContext(ctx,tool,path)
              cmd.Dir=filepath.Dir(tool);cmd.SysProcAttr=&syscall.SysProcAttr{HideWindow:true}
              stdout:=&limitedMediaOutput{n:8<<20};stderr:=&limitedMediaOutput{n:256<<10};cmd.Stdout=stdout;cmd.Stderr=stderr
              e=cmd.Run()
              if ctx.Err()!=nil{return nil,ctx.Err()}
              if e!=nil { msg:=stderr.b.String();if strings.Contains(strings.ToLower(msg),"no claim found"){return map[string]any{"status":"inconclusivo: nenhuma credencial encontrada","details":"A ausência de credenciais não comprova que o vídeo é real ou gerado por IA."},nil};return map[string]any{"status":"inconclusivo: falha ou formato sem suporte","details":msg},nil }
              var report any
              if e=json.Unmarshal(stdout.b.Bytes(),&report);e!=nil{return nil,fmt.Errorf("relatório C2PA inválido: %w",e)}
              return map[string]any{"status":"relatório de procedência disponível; confira a validação e o emissor","details":report},nil
          }
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'desktop_windows.go'), $source, $utf8)

          $source = @'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;"><title>ZEUVORYX</title><style>
