<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"><style>body{background:#10182b;color:#f2f5ff;text-align:center;font:16px system-ui;margin:8px}canvas{background:#070b17;border:2px solid #607ca9;max-width:100%;max-height:460px}button{background:#22385b;color:white;border:1px solid #90a7c9;border-radius:7px;margin:4px;padding:10px;font:inherit;cursor:pointer}p{margin:8px}</style></head><body><h2>Blocos — Tetris-like</h2><p id="score">Pontos: 0</p><canvas id="board" width="240" height="440"></canvas><div><button id="left">◀</button><button id="rotate">Girar</button><button id="right">▶</button><button id="down">Descer</button><button id="restart">Reiniciar</button></div><script>
const c=document.getElementById('board'),g=c.getContext('2d'),W=10,H=20,cell=22,colors=['#0b1222','#38bdf8','#facc15','#a78bfa','#fb923c','#4ade80','#f87171','#60a5fa'],shapes=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[4,0,0],[4,4,4]],[[0,5,5],[5,5,0]],[[6,6,0],[0,6,6]],[[0,0,7],[7,7,7]]];let b,p,x,y,score,over,timer;
function spawn(){p=shapes[Math.floor(Math.random()*shapes.length)].map(r=>r.slice());x=Math.floor((W-p[0].length)/2);y=0;if(!fits(p,x,y))over=true}
function fits(a,xx,yy){return a.every((row,j)=>row.every((v,i)=>!v||(xx+i>=0&&xx+i<W&&yy+j>=0&&yy+j<H&&!b[yy+j][xx+i])))}
function move(dx){if(!over&&fits(p,x+dx,y))x+=dx;draw()}
function rotate(){if(over)return;let a=p[0].map((_,i)=>p.map(r=>r[i]).reverse());for(const k of [0,-1,1,-2,2])if(fits(a,x+k,y)){p=a;x+=k;break}draw()}
function step(){if(over)return;if(fits(p,x,y+1))y++;else{p.forEach((r,j)=>r.forEach((v,i)=>{if(v)b[y+j][x+i]=v}));let n=0;b=b.filter(r=>{if(r.every(Boolean)){n++;return false}return true});while(b.length<H)b.unshift(Array(W).fill(0));score+=n*n*100;spawn()}draw()}
function draw(){g.clearRect(0,0,c.width,c.height);function block(v,i,j){g.fillStyle=colors[v];g.fillRect(i*cell+10,j*cell,cell-1,cell-1)}b.forEach((r,j)=>r.forEach((v,i)=>block(v,i,j)));if(!over)p.forEach((r,j)=>r.forEach((v,i)=>{if(v)block(v,x+i,y+j)}));document.getElementById('score').textContent='Pontos: '+score+(over?' · Fim de jogo':'')}
function reset(){b=Array.from({length:H},()=>Array(W).fill(0));score=0;over=false;spawn();draw()}document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.getElementById('rotate').onclick=rotate;document.getElementById('down').onclick=step;document.getElementById('restart').onclick=reset;addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();({ArrowLeft:()=>move(-1),ArrowRight:()=>move(1),ArrowUp:rotate,ArrowDown:step})[e.key]()}});reset();timer=setInterval(step,650);addEventListener('pagehide',()=>clearInterval(timer),{once:true});</script></body></html>
