name: ZEUVORYX LAB - Public threat indicator verification
on:
  push:
    branches: [lab-public-ioc-20261125, lab-protection-wave-20261125, lab-fieldlearn-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test actual repository scanner against public metadata
        shell: pwsh
        run: |
          git hash-object scanner.go pe.go
          Copy-Item lab/public_ioc_test.go.txt public_ioc_lab_test.go
          go test -v -count=5 scanner.go pe.go public_ioc_lab_test.go
          if ($LASTEXITCODE -ne 0) { throw 'Public indicator regression failed' }
      - name: Protection proxies, benign alert survey and IO baseline
        shell: pwsh
        run: |
          Copy-Item lab/comparative_test.go.txt comparative_lab_test.go
          go test -v -count=5 scanner.go pe.go comparative_lab_test.go
          if ($LASTEXITCODE -ne 0) { throw 'Comparative diagnostic failed' }
      - name: Evidence classification and single-pass full-file hash regression
        shell: pwsh
        run: |
          Copy-Item lab/evolution315_test.go.txt evolution315_lab_test.go
          go test -v -count=5 scanner.go pe.go evolution315_lab_test.go
          if ($LASTEXITCODE -ne 0) { throw 'Evidence or complete hash regression failed' }
          go test -v -count=5 ./remediation
          if ($LASTEXITCODE -ne 0) { throw 'Remediation safety regression failed' }
      - name: Resident scan coordination, network advisory and reversible quarantine
        shell: pwsh
        run: |
          go test -v -count=5 ./changeguard ./behaviorwatch ./globalintel ./remediation
          if ($LASTEXITCODE -ne 0) { throw 'Protection module regression failed' }
          Copy-Item lab/resident_integration_test.go.txt resident_integration_lab_test.go
          go test -v -count=5 scanner.go pe.go quarantine.go resident_integration_lab_test.go
          if ($LASTEXITCODE -ne 0) { throw 'Resident or quarantine integration failed' }
      - name: Multi-engine observation privacy and schema
        shell: pwsh
        run: |
          go test -v -count=5 ./fieldlearn
          if ($LASTEXITCODE -ne 0) { throw 'Field learning evidence regression failed' }
