          	if e := saveSnapshot(p, v); e == nil {
          		t.Fatal("invalid accepted")
          	}
          	r, e := loadSnapshot(p)
          	if e != nil || len(r.Hashes) != 0 {
          		t.Fatal(r, e)
          	}
          	os.WriteFile(p, []byte("broken"), 0600)
          	if _, e = loadSnapshot(p); e == nil {
          		t.Fatal("corruption hidden")
