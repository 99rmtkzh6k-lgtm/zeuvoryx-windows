          	}
          	r, e := loadSnapshot(p)
          	if e != nil || len(r.Hashes) != 1 || len(r.URLs) != 1 {
          		t.Fatal(r, e)
          	}
          	v.Hashes[strings.Repeat("b", 64)] = "second"
          	if e = saveSnapshot(p, v); e != nil {
          		t.Fatal(e)
          	}
          	r, e = loadSnapshot(p)
          	if e != nil || len(r.Hashes) != 2 {
          		t.Fatal(r, e)
          	}
          }
