          </style></head><body><div class="shell"><aside><div class="brand"><svg viewBox="0 0 64 72" fill="none" aria-hidden="true"><path d="M32 4 58 14v22c0 16-10 27-26 34C16 63 6 52 6 36V14Z" fill="#15384c" stroke="#53e4d0" stroke-width="3"/><path d="M17 23h30L22 48h25" stroke="#e8fffd" stroke-width="6" stroke-linejoin="round"/></svg>ZEUVORYX</div><div class="tag">OLYMPUS 3.0</div><nav class="nav"><button class="active" data-page="overview">Visão geral</button><button data-page="alerts">Alertas</button><button data-page="quarantine">Quarentena</button><button data-page="media">Autenticidade de vídeo</button><button data-page="engine">Motor e IA</button><button data-page="tools">Ferramentas</button><button data-page="security">Segurança Windows</button><button data-page="defender">Motor Defender</button><button data-page="links">Links e fraudes</button><button data-page="intel">Inteligência de ameaças</button></nav><img class="zeus-art" src="__PANEL__" alt="Arte oficial do ZEUVORYX"><p class="note">Análise local de arquivos. Esta versão não bloqueia a execução de malware nem substitui o Microsoft Defender.</p></aside><main><header><div><h1>Central de segurança</h1><p class="sub">Escolha a análise que deseja executar</p></div><div class="actions"><div class="pill" id="badge">Inicializando</div><button id="minimize">Minimizar</button></div></header><section id="overview"><div class="hero" id="hero"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="44" fill="none" stroke="#30445d" stroke-width="6"/><circle class="arc" cx="60" cy="60" r="44" fill="none" stroke="#53e4d0" stroke-width="6" stroke-linecap="round"/></svg><span>⌁</span></div><div><h2 id="stateTitle">Bem-vindo ao ZEUVORYX</h2><p id="stateText">Aguardando sua escolha. Nenhuma varredura é iniciada automaticamente.</p><div class="actions"><button id="start" disabled>Varredura completa</button><button id="quick" class="primary" disabled>Varredura rápida</button><button id="stop" disabled>Cancelar</button><button id="export" disabled>Exportar relatório</button></div><p class="mode-help">Rápida: locais prioritários. Completa: discos locais acessíveis.</p></div></div><div class="grid"><div class="card"><div class="label">ARQUIVOS ANALISADOS</div><div class="metric" id="files">0</div></div><div class="card"><div class="label">VOLUME ANALISADO</div><div class="metric" id="bytes">0 B</div></div><div class="card"><div class="label">ALERTAS DO RELATÓRIO</div><div class="metric" id="hits">—</div></div></div><div class="card chart"><h2>Atividade da varredura</h2><p class="sub">Arquivos examinados por intervalo de atualização de aproximadamente 2 segundos.</p><svg viewBox="0 0 600 140" preserveAspectRatio="none" role="img" aria-label="Gráfico de arquivos examinados por intervalo"><path d="M35 10H590M35 65H590M35 120H590" stroke="#2c405d" fill="none" stroke-dasharray="4 5"/><text x="0" y="15" id="chartMax">0</text><text x="8" y="123">0</text><polyline id="curve" points="" fill="none" stroke="#53e4d0" stroke-width="2.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><p class="speed" id="speed">Velocidade: aguardando medição.</p><p class="muted" id="activity">Aguardando medições.</p></div><div id="afterScan" class="card hidden"><h2>Deseja liberar espaço?</h2><p class="sub">Confira os temporários antigos antes de remover.</p><button id="afterCleanup">Revisar limpeza</button></div><div class="card"><h2>Cobertura da análise</h2><p class="sub" id="scope">Discos locais fixos; arquivos protegidos ou inacessíveis podem ser ignorados.</p><p class="sub" id="skipped"></p></div></section><section id="alerts" class="hidden card"><h2>Alertas e resultados</h2><p class="sub">Os resultados completos aparecem no fim da varredura. Alertas heurísticos não confirmam infecção.</p><div id="findings" class="list"></div></section><section id="quarantine" class="hidden card"><h2>Arquivos em quarentena</h2><p class="sub">O isolamento e a restauração exigem confirmação.</p><div id="qitems" class="list"></div><button id="refreshQ">Atualizar lista</button></section><section id="media" class="hidden card"><h2>Autenticidade de vídeo</h2><p class="sub">Verificação C2PA de procedência digital, não um detector neural de deepfakes. A análise pode consultar referências remotas de credenciais. A falta de credenciais é inconclusiva.</p><input class="media-field" id="videoPath" placeholder="Selecione um vídeo MP4 ou MOV" readonly><div class="actions"><button id="chooseVideo">Escolher vídeo</button><button id="checkVideo" class="primary">Verificar procedência</button></div><p id="videoStatus" class="sub" role="status"></p><pre class="media-report" id="videoResult"></pre></section><section id="security" class="hidden card"><h2>Segurança em camadas</h2><p class="sub">Diagnóstico somente leitura do Microsoft Defender, firewall e versão do Windows. Não é um firewall próprio, nem uma auditoria de vulnerabilidades CVE.</p><div class="actions" style="margin:15px 0"><button id="auditWindows" class="primary">Consultar proteção</button><button id="openSecurity">Abrir Segurança do Windows</button><button id="openUpdates">Verificar Windows Update</button></div><p id="auditState" class="sub" role="status">Aguardando consulta.</p><div id="auditReport" class="list"></div></section><section id="defender" class="hidden card"><h2>Motor de proteção Microsoft Defender</h2><p class="sub">Comandos reais do Windows. O Defender é um motor separado do ZEUVORYX; a proteção residente, a atualização automática e as ações contra malware dependem do estado e das políticas do Windows. Esta tela não ativa nem desativa essas políticas.</p><div class="actions" style="margin:15px 0"><button class="primary" data-native="quick">Verificação rápida Defender</button><button data-native="full">Verificação completa Defender</button><button data-native="update">Atualizar assinaturas Defender</button><button data-native="history">Histórico de ameaças</button><button data-native="updates">Consultar atualizações pendentes</button><button data-native="remediate" class="primary">Tratar ameaças ativas</button><button data-native="network-block">Ativar bloqueio de conexões perigosas</button><button data-native="folder-block">Ativar proteção de pastas</button><p class="note">As opções de bloqueio exigem Defender ativo e podem exigir abrir ZEUVORYX como administrador. A proteção de pastas pode impedir a gravação por aplicativos legítimos; consulte a Segurança do Windows para revisar as permissões. Não alteramos essas políticas sem sua confirmação.</p></div><p class="sub" id="nativeState" role="status">Aguardando sua escolha. Nenhuma operação iniciada.</p><div id="nativeReport" class="list"></div><p class="note">O Windows pode solicitar permissões ou recusar operações quando o Defender está desativado, em modo passivo ou sob políticas administrativas. O Defender pode tratar ameaças durante a varredura conforme suas configurações. Fechar o ZEUVORYX pode não interromper uma varredura já solicitada ao Windows.</p></section><section id="links" class="hidden card"><h2>Verificação de links e fraudes</h2><p class="sub">Examina a estrutura do endereço sem acessar o site, consultar DNS ou enviar dados. Também consulta a lista local importada de URLs. Não é reputação online nem bloqueio automático de phishing. HTTPS não garante que um site seja legítimo.</p><input id="urlCheck" class="media-field" type="text" maxlength="8192" placeholder="https://..." autocomplete="off" spellcheck="false"><button id="checkLink" class="primary">Examinar endereço</button><div id="linkReport" class="list" role="status"></div><div class="entry"><h2>Fraudes financeiras e roubo de identidade</h2><p>Triagem local de texto, sem envio a servidores. Não cole senhas, chaves privadas, frases de recuperação, códigos, CPF ou documentos reais. Padrões não comprovam fraude nem legitimidade.</p><textarea id="fraudInput" class="media-field" rows="5" maxlength="8192" autocomplete="off" spellcheck="false" placeholder="Cole somente a mensagem suspeita, sem dados pessoais"></textarea><button id="fraudCheck">Examinar mensagem</button><div id="fraudReport" class="list" role="status"></div></div><div class="entry"><h2>Resposta a incidentes</h2><p>Escolha um cenário para receber ações de contenção e recuperação. O roteiro não executa mudanças em contas, carteiras ou rede.</p><div class="actions"><button data-incident="crypto">Criptomoedas</button><button data-incident="identity">Identidade / contas</button><button data-incident="malware">Malware</button><button data-incident="ransomware">Ransomware</button></div><div id="incidentReport" class="list" role="status"></div></div></section><section id="tools" class="hidden card"><h2>Ferramentas de segurança e manutenção</h2><p class="sub">A limpeza é opcional. Não alteramos registro, perfis de navegador ou arquivos do sistema.</p><div class="entry"><h2>Monitoramento periódico</h2><p class="sub">Varredura rápida a cada 5 minutos, enquanto o aplicativo estiver aberto, inclusive minimizado. Pausa se houver análise ou alertas pendentes. Não bloqueia malware antes da execução.</p><label><input type="checkbox" id="monitor"> Ativar nesta sessão</label></div><div class="entry"><h2>Limpeza de temporários</h2><p class="sub">Localiza arquivos .tmp do usuário com mais de 7 dias. Você confirma antes de remover.</p><button id="previewCleanup">Examinar temporários</button><p id="cleanupResult" class="sub"></p></div></section><section id="intel" class="hidden card"><h2>Inteligência de ameaças e vulnerabilidades</h2><p class="sub">Indicadores SHA-256 complementam o Defender. Não são um modelo de IA e não detectam variantes desconhecidas. Nenhuma amostra ou arquivo do PC é enviado. A base adicionada é armazenada localmente e recarregada ao abrir o aplicativo. A origem deve ser confiável; indicadores não são confirmação de infecção.</p><div class="entry"><h2>MalwareBazaar • abuse.ch</h2><p>Consultar os 100 registros mais recentes via API oficial. Requer sua Auth-Key e autorização de uso conforme os termos do serviço. A chave não é armazenada pelo aplicativo.</p><label for="intelKey">Auth-Key</label><input id="intelKey" class="media-field" type="password" autocomplete="off" maxlength="256"><button id="intelSync" class="primary">Consultar e incorporar indicadores</button><p id="intelResult" role="status">Aguardando consulta.</p></div><div class="entry"><h2>Importar lista de hashes</h2><p>Cole SHA-256 de uma fonte confiável, um por linha. Correspondências são alertas sujeitos à sua revisão, não exclusões automáticas.</p><textarea id="intelList" class="media-field" rows="5" maxlength="8388608" placeholder="SHA-256 por linha"></textarea><button id="intelImport">Validar e incorporar</button><button id="intelCount">Consultar base ativa</button><p id="intelCountResult" role="status"></p></div><div class="entry"><h2>Reputação de URLs</h2><p>Importe uma lista de URLs de uma fonte confiável, como a lista de texto do URLhaus, uma por linha. Substitui a lista anterior. Não acessa os endereços. Correspondência exata não é bloqueio automático.</p><textarea id="reputationList" class="media-field" rows="4" maxlength="8388608" placeholder="Uma URL por linha"></textarea><button id="repImport">Validar e salvar lista</button><p id="repResult" role="status"></p></div><div class="entry"><h2>Vulnerabilidades exploradas • CISA KEV</h2><p>Pesquise um código CVE conhecido. A consulta não determina se o seu computador possui a vulnerabilidade.</p><input id="cveInput" class="media-field" maxlength="32" placeholder="CVE-2025-1234"><button id="cveCheck">Consultar catálogo oficial</button><div id="cveResult" class="list" role="status"></div></div></section><section id="engine" class="hidden card"><h2>Motor e inteligência artificial</h2><p class="sub">Motor atual: SHA-256, regras heurísticas e análise PE. Modelo treinado de malware: não instalado. Detector neural de vídeo: não instalado. C2PA: verificador de procedência digital separado.</p><div class="entry"><h2>ClamAV — segundo motor independente do Defender</h2><p>Requer instalação oficial separada do ClamAV e assinaturas atualizadas pelo FreshClam. Examina um arquivo por vez; não remove automaticamente e não é proteção residente.</p><button id="clamCheck">Consultar instalação</button><button id="clamChoose">Examinar arquivo com ClamAV</button><p id="clamState" role="status"></p><pre id="clamReport" class="media-report"></pre></div><img class="mythic" src="__PANEL__" alt="Arte original do painel mitológico"><p class="sub">A classificação de risco é uma pontuação heurística, não uma probabilidade de infecção.</p></section><p id="msg" role="status"></p><footer>ZEUVORYX · Beta experimental · Não desative a proteção do Windows.</footer><div class="z-authorship" aria-label="Created and engineered by Leonardo A Botelho"><span>CREATED &amp; ENGINEERED BY</span><strong>Leonardo A Botelho</strong><small>© 2026 ZEUVORYX</small></div></main></div><dialog id="confirmBox"><h2>Confirme a operação</h2><p id="confirmText"></p><div class="actions"><button id="no">Cancelar</button><button id="yes" class="primary">Confirmar</button></div></dialog><script>
          'use strict';const el=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('pt-BR');let last=null,series=[],key='',busy=false,confirmResolve=null;function volume(n){if(n>=1073741824)return (n/1073741824).toFixed(2)+' GB';if(n>=1048576)return (n/1048576).toFixed(1)+' MB';if(n>=1024)return (n/1024).toFixed(1)+' KB';return fmt(n)+' B'}function node(tag,text,cls){let x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x}function ask(text){el('confirmText').textContent=text;el('confirmBox').showModal();return new Promise(r=>confirmResolve=r)}function closeConfirm(ok){el('confirmBox').close();const r=confirmResolve;confirmResolve=null;if(r)r(ok)}el('yes').onclick=()=>closeConfirm(true);el('no').onclick=()=>closeConfirm(false);el('confirmBox').oncancel=e=>{e.preventDefault();closeConfirm(false)};async function action(fn){try{el('msg').textContent='';await fn()}catch(e){el('msg').textContent=String(e)}}function chart(n,running){if(last!==null&&n<last){series=[];last=null}if(running&&last!==null){series.push(Math.max(0,n-last));if(series.length>40)series.shift()}last=n;const max=Math.max(1,...series);el('chartMax').textContent=fmt(Math.max(0,...series));el('curve').setAttribute('points',series.map((v,i)=>`${35+i*555/Math.max(1,series.length-1)},${120-110*v/max}`).join(' '));el('activity').textContent=series.length?fmt(series.at(-1))+' arquivos no último intervalo medido.':'Aguardando medições.'}function resetChart(){last=null;series=[];lastMeasure=null;el('curve').setAttribute('points','')}function renderFindings(s){let r=s.report||{},box=el('findings');box.replaceChildren();let list=r.findings||[];if(!list.length)box.append(node('p',s.running?'Varredura em andamento.':s.done?'Nenhum alerta neste relatório.':'Nenhum relatório disponível.','muted'));for(const f of list){let row=node('div','','entry');row.append(node('strong',`${f.level} · ${f.risk}/100`,'risk'),node('p',f.path),node('p',(f.reasons||[]).join(' · ')));if(!f.path.includes(' :: ')){let b=node('button','Isolar arquivo');b.disabled=s.running;b.onclick=()=>action(async()=>{if(await ask('Mover para quarentena? Isso pode afetar programas legítimos. '+f.path)){await window.isolate(f.path);await loadQ();el('msg').textContent='Arquivo isolado.'}});row.append(b)}box.append(row)}}async function loadQ(){const items=await window.quarantineList()||[],box=el('qitems');box.replaceChildren();if(!items.length)box.append(node('p','Nenhum arquivo isolado.','muted'));for(const q of items){const row=node('div','','entry');row.append(node('strong',q.original),node('p',new Date(q.when).toLocaleString('pt-BR')));let b=node('button','Restaurar');b.onclick=()=>action(async()=>{if(await ask('Restaurar arquivo potencialmente perigoso? '+q.original)){await window.restoreItem(q.id);await loadQ()}});row.append(b);let del=node('button','Excluir definitivamente');del.onclick=()=>action(async()=>{if(await ask('Excluir definitivamente este item da quarentena? Não será possível restaurar. '+q.original)){await window.deleteQuarantined(q.id);await loadQ();el('msg').textContent='Item excluído da quarentena.'}});row.append(del);box.append(row)}}async function refresh(){if(busy)return;busy=true;try{const s=await window.getScanState(),r=s.report||{};let running=s.running;el('monitor').checked=!!s.monitor;el('previewCleanup').disabled=running;el('afterScan').classList.toggle('hidden',running||!s.done||!!r.cancelled||!!s.error);el('hero').classList.toggle('scanning',running);el('badge').textContent=running?'Analisando':s.error?'Erro na análise':s.done?'Análise encerrada':'Pronto';el('stateTitle').textContent=running?'Varredura em andamento':s.error?'A análise encontrou um erro':s.done?(r.cancelled?'Varredura cancelada':'Varredura concluída'):'Escolha como deseja começar';el('stateText').textContent=s.error|| (running?'Você pode minimizar esta janela enquanto os arquivos são examinados.':s.done?'Verifique os resultados e os itens não examinados.':'Nenhuma varredura foi iniciada. Selecione a análise rápida ou completa, ou use o menu lateral.');el('files').textContent=fmt(s.files);el('bytes').textContent=volume(s.bytes);el('hits').textContent=s.done?fmt((r.findings||[]).length):'—';el('scope').textContent=r.root||'Nenhuma seleção de escopo ainda';el('skipped').textContent=s.done?fmt(r.skipped)+' itens ignorados ou não examinados. '+(r.errors?.[0]||''):'A cobertura final será informada após a análise.';el('start').disabled=running;el('quick').disabled=running;measureSpeed(s.bytes,running);el('stop').disabled=!running;el('export').disabled=running||!s.done;chart(s.files,running);let k=String(r.started)+String(r.finished)+running+String((r.findings||[]).length);if(k!==key){key=k;renderFindings(s)}}catch(e){el('msg').textContent='Interface: '+String(e)}finally{busy=false}}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));['overview','alerts','quarantine','media','engine','tools','security','links','defender','intel'].forEach(id=>el(id).classList.toggle('hidden',id!==b.dataset.page));if(b.dataset.page==='quarantine')action(loadQ)});let lastMeasure=null;function measureSpeed(n,running){const t=performance.now();if(running&&lastMeasure&&n>=lastMeasure.n&&t>lastMeasure.t){const rate=(n-lastMeasure.n)/((t-lastMeasure.t)/1000);el('speed').textContent='Velocidade: '+volume(rate)+'/s'}else if(!running){el('speed').textContent='Velocidade: varredura parada.'}lastMeasure=running?{n,t}:null}el('quick').onclick=()=>action(async()=>{if(await window.startQuickScan())resetChart();await refresh()});el('chooseVideo').onclick=()=>action(async()=>{const p=await window.chooseVideo();if(p)el('videoPath').value=p});el('checkVideo').onclick=()=>action(async()=>{const p=el('videoPath').value;if(!p)throw Error('Escolha um vídeo primeiro');const b=el('checkVideo');b.disabled=true;el('videoStatus').textContent='Verificando procedência...';el('videoResult').textContent='';try{const r=await window.verifyVideo(p);el('videoStatus').textContent=r.status;el('videoResult').textContent=typeof r.details==='string'?r.details:JSON.stringify(r.details,null,2)}catch(e){el('videoStatus').textContent='Inconclusivo: '+String(e)}finally{b.disabled=false}});el('start').onclick=()=>action(async()=>{if(await window.startScan())resetChart();await refresh()});el('stop').onclick=()=>action(async()=>{await window.stopScan();await refresh()});el('export').onclick=()=>action(async()=>{el('msg').textContent='Relatório salvo em: '+await window.exportReport()});el('refreshQ').onclick=()=>action(loadQ);el('afterCleanup').onclick=()=>{document.querySelector('[data-page=tools]').click();el('previewCleanup').click()};el('minimize').onclick=()=>action(()=>window.minimizeApp());el('monitor').onchange=()=>action(async()=>{await window.setMonitor(el('monitor').checked);await refresh()});el('previewCleanup').onclick=()=>action(async()=>{const p=await window.previewCleanup();el('cleanupResult').textContent=fmt(p.files)+' arquivos temporários elegíveis · '+volume(p.bytes);if(p.files>0&&await ask('Remover '+fmt(p.files)+' temporários antigos ('+volume(p.bytes)+')?')){const r=await window.applyCleanup();el('cleanupResult').textContent=fmt(r.files)+' removidos · '+volume(r.bytes)+' liberados · '+fmt(r.skipped)+' ignorados'}});refresh();setInterval(refresh,2000);
          
          function auditRow(box,title,value){const row=node('div','','entry');row.append(node('strong',title),node('p',String(value)));box.append(row)}
          function stateLabel(v){return v===true?'Ativado':v===false?'Desativado':'Não verificado'}
          function policyLabel(v){return v===1?'Bloqueio ativado':v===0?'Desativado':v===2?'Modo de auditoria':typeof v==='number'?'Modo '+v+' (consulte o Windows)':'Não verificado'}
          el('auditWindows').onclick=()=>action(async()=>{const b=el('auditWindows'),box=el('auditReport');b.disabled=true;box.replaceChildren();el('auditState').textContent='Consultando o Windows...';try{const a=await window.windowsSecurityAudit(),d=a.defender||{},u=a.updates||{};auditRow(box,'Microsoft Defender',stateLabel(d.antivirus));auditRow(box,'Proteção em tempo real do Defender',stateLabel(d.realTime));auditRow(box,'Monitoramento comportamental do Defender',stateLabel(d.behavior));auditRow(box,'Modo de execução',d.runningMode||'Não verificado');auditRow(box,'Proteção contra adulteração',stateLabel(d.tamper));auditRow(box,'Inspeção de arquivos baixados (Defender)',stateLabel(d.ioav));auditRow(box,'Inspeção de rede (Defender)',stateLabel(d.nis));const asr=a.asr||{},hard=a.systemHardening||{};auditRow(box,'Proteção de aplicativos potencialmente indesejados',policyLabel(asr.pua));auditRow(box,'Proteção em nuvem (MAPS)',typeof asr.cloudReporting==='number'?'Modo '+asr.cloudReporting:'Não verificado');auditRow(box,'Regras ASR configuradas',Array.isArray(asr.rules)?String(asr.rules.length):'Não verificado');for(const rule of asr.rules||[])auditRow(box,'ASR '+rule.id,rule.action===1?'Bloqueio':rule.action===2?'Auditoria':rule.action===6?'Aviso':rule.action===0?'Desativada':'Modo '+rule.action);auditRow(box,'Secure Boot',stateLabel(hard.secureBoot));auditRow(box,'BitLocker (disco do sistema)',hard.diskProtection||'Não verificado');auditRow(box,'Conexões RDP permitidas pela configuração',stateLabel(hard.rdpAllowed));auditRow(box,'Controle de pastas contra ransomware (Defender)',policyLabel(a.policies?.controlledFolders));auditRow(box,'Proteção de rede (Defender)',policyLabel(a.policies?.networkProtection));auditRow(box,'Assinaturas do Defender',d.signatureVersion||'Não verificado');auditRow(box,'Idade das assinaturas',typeof d.signatureAge==='number'?d.signatureAge+' dias':'Não verificado');if(Array.isArray(a.firewall)&&a.firewall.length){for(const f of a.firewall)auditRow(box,'Firewall '+f.name,stateLabel(f.enabled))}else auditRow(box,'Firewall','Não verificado');auditRow(box,'Windows',u.os?u.os+' | build '+u.build:'Não verificado');for(const e of a.errors||[])auditRow(box,'Consulta indisponível',e);el('auditState').textContent='Consulta concluída. Atualizações pendentes devem ser conferidas no Windows Update.'}catch(e){el('auditState').textContent=String(e)}finally{b.disabled=false}});
          el('openSecurity').onclick=()=>action(()=>window.openSecuritySettings('security'));
          el('openUpdates').onclick=()=>action(()=>window.openSecuritySettings('updates'));
          el('checkLink').onclick=()=>action(async()=>{const box=el('linkReport');box.replaceChildren();try{const r=await window.assessLink(el('urlCheck').value);auditRow(box,'Domínio interpretado',r.host);auditRow(box,'Avaliação',r.assessment);for(const s of r.signals||[])auditRow(box,'Indicador',s);auditRow(box,'Limitação','Nenhum resultado comprova que o endereço seja seguro. Confira a origem por um canal oficial.')}catch(e){auditRow(box,'Endereço não avaliado',String(e))}});
          
          
          let nativeBusy=false,nativeKey='';
          function renderNative(s){
           const buttons=document.querySelectorAll('[data-native]');buttons.forEach(b=>b.disabled=!!s.running);
           const box=el('nativeReport'),state=el('nativeState');
           if(s.running){state.textContent='Operação solicitada ao Windows. Aguardando resposta...';return}
           if(!s.operation){state.textContent='Aguardando sua escolha. Nenhuma operação iniciada.';return}
           state.textContent=s.error?'Operação não confirmada: '+s.error:'O Windows retornou um resultado. Confira os detalhes abaixo.';
           const key=JSON.stringify(s);if(key===nativeKey)return;nativeKey=key;box.replaceChildren();
           if(s.error){auditRow(box,'Falha ou indisponibilidade',s.error);return}
           const r=s.result||{};auditRow(box,'Resultado',r.message||'Resposta sem descrição');
           if(s.operation==='network-block'||s.operation==='folder-block'){auditRow(box,'Modo anterior',String(r.before??'Desconhecido'));auditRow(box,'Modo configurado',r.after===1?'Bloqueio (confirmado pela configuração)':'Não confirmado');auditRow(box,'Limitação','Verificação da configuração, não um teste de bloqueio real.')}
           if(s.operation==='remediate'){auditRow(box,'Ameaças ativas antes',typeof r.activeBefore==='number'?String(r.activeBefore):'Não confirmado');auditRow(box,'Ameaças ativas após',typeof r.activeAfter==='number'?String(r.activeAfter):'Não confirmado');auditRow(box,'Próxima ação',r.activeAfter===0?'Nenhuma ameaça ativa reportada nesta consulta; faça nova varredura. Isso não garante ausência de malware.':'Ameaças remanescentes ou estado desconhecido: nova análise e suporte especializado.')}
           if(s.operation==='update'){auditRow(box,'Versão das assinaturas',r.version||'Não confirmada');auditRow(box,'Idade das assinaturas',typeof r.age==='number'?r.age+' dias':'Não confirmada')}
           if(s.operation==='history'){const rows=Array.isArray(r.detections)?r.detections:[];auditRow(box,'Registros retornados',rows.length+' (até 100; não é uma contagem de infecções ativas)');for(const x of rows){auditRow(box,'ID '+x.id+' | '+x.when,'Ação reportada: '+(x.actionSuccess===true?'Bem-sucedida':x.actionSuccess===false?'Não concluída':'Não informada')+' | '+(x.resources||[]).join(' · '))}}
           if(s.operation==='updates'){auditRow(box,'Código da consulta',r.resultCode===2?'Sucesso':r.resultCode===3?'Sucesso com erros':String(r.resultCode??'Desconhecido'));auditRow(box,'Atualizações encontradas',typeof r.count==='number'?String(r.count):'Não confirmado');for(const u of r.updates||[])auditRow(box,u.title,(u.kb||[]).join(', '));auditRow(box,'Limitação','A consulta ao Windows Update não é uma auditoria completa de vulnerabilidades.')}
          }
          async function refreshNative(){if(nativeBusy)return;nativeBusy=true;try{renderNative(await window.nativeStatus())}catch(e){el('nativeState').textContent=String(e)}finally{nativeBusy=false}}
          document.querySelectorAll('[data-native]').forEach(b=>b.onclick=()=>action(async()=>{const op=b.dataset.native;if((op==='network-block'||op==='folder-block')&&!await ask(op==='network-block'?'Ativar proteção de rede do Microsoft Defender em modo de bloqueio? Conexões classificadas como perigosas podem ser impedidas.':'Ativar acesso controlado a pastas do Microsoft Defender? Aplicativos legítimos não autorizados também podem ter gravações bloqueadas. Confira as configurações do Windows se necessário.'))return;if(op==='remediate'&&!await ask('Solicitar ao Microsoft Defender o tratamento de TODAS as ameaças ativas que ele detectou? O Windows poderá remover ou isolar arquivos. Confira os alertas antes de confirmar.'))return;if((op==='quick'||op==='full')&&!await ask('Iniciar uma varredura com Microsoft Defender? O Windows pode tratar arquivos detectados de acordo com suas políticas.'))return;try{await window.nativeStart(op);nativeKey='';el('nativeReport').replaceChildren();await refreshNative()}catch(e){el('nativeState').textContent=String(e)}}));
          refreshNative();setInterval(refreshNative,2000);
          el('fraudCheck').onclick=()=>action(async()=>{const box=el('fraudReport'),raw=el('fraudInput').value;el('fraudInput').value='';box.replaceChildren();try{const r=await window.assessFraud(raw);auditRow(box,'Avaliação',r.assessment);for(const x of r.signals||[])auditRow(box,'Indicador',x);for(const x of r.actions||[])auditRow(box,'Ação recomendada',x)}catch(e){box.textContent=String(e)}});
          document.querySelectorAll('[data-incident]').forEach(b=>b.onclick=()=>action(async()=>{const box=el('incidentReport');box.replaceChildren();try{const r=await window.incidentPlan(b.dataset.incident);r.forEach((x,i)=>auditRow(box,'Passo '+(i+1),x))}catch(e){box.textContent=String(e)}}));
          
          
          async function intelRun(button, result, fn){const b=el(button),r=el(result);b.disabled=true;r.textContent='Processando...';try{const v=await fn();r.textContent='Indicadores novos: '+v.added+' | Total ativo: '+v.total+' | Registros recebidos: '+v.sourceRecords+'. Faça uma nova varredura para aplicar.'}catch(e){r.textContent='Não atualizado: '+String(e)}finally{b.disabled=false}}
          el('intelSync').onclick=()=>{const k=el('intelKey').value;el('intelKey').value='';return intelRun('intelSync','intelResult',()=>window.syncThreatHashes(k))};
