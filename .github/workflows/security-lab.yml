name: ZEUVORYX 3.0.3 security foundation lab
on:
  push:
    branches: [security-3.0.3-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Verify security foundations on Windows
        shell: pwsh
        run: |
          go vet ./releaseguard ./impact ./remediation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v -count=10 -cover ./releaseguard ./impact ./remediation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Race and regression checks
        run: |
          go vet ./releaseguard ./impact ./remediation
          go test -race -count=10 -cover ./releaseguard ./impact ./remediation
