name: ZEUVORYX 3.0.4 security foundation lab
on:
  push:
    branches: [security-3.0.4-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Verify security foundations on Windows
        shell: pwsh
        run: |
          go vet ./releaseguard ./impact ./remediation ./updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v -count=10 -shuffle=on -cover ./releaseguard ./impact ./remediation ./updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Race and regression checks
        run: |
          go vet ./releaseguard ./impact ./remediation ./updater
          go test -race -count=10 -shuffle=on -cover ./releaseguard ./impact ./remediation ./updater
          go test -run '^$' -fuzz '^FuzzSignedManifest$' -fuzztime=10s -parallel=2 ./releaseguard
          go test -run '^$' -fuzz '^FuzzSignedSnapshot$' -fuzztime=10s -parallel=2 ./impact

  macos-updater:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go vet ./updater
      - run: go test -race -count=10 ./updater
