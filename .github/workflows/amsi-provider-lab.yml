name: ZEUVORYX LAB - AMSI provider diagnostic
on:
  push:
    branches: [windows-3.0.14-audit-fix]
    paths:
      - 'nativeamsi/**'
      - '.github/workflows/amsi-provider-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reference:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Read-only Windows provider status and independent CSharp test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | Format-List
          Get-Service -Name WinDefend,WdNisSvc -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType | Format-List
          try {
            Get-MpComputerStatus | Select-Object AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,AMRunningMode,AntivirusSignatureAge | Format-List
          } catch { Write-Warning "Defender status unavailable: $_" }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class ZvxAmsiProbe {
            [DllImport("amsi.dll", CharSet=CharSet.Unicode, ExactSpelling=true)]
            static extern int AmsiInitialize(string app, out IntPtr context);
            [DllImport("amsi.dll", ExactSpelling=true)]
            static extern int AmsiOpenSession(IntPtr context, out IntPtr session);
            [DllImport("amsi.dll", CharSet=CharSet.Unicode, ExactSpelling=true)]
            static extern int AmsiScanBuffer(IntPtr context, byte[] data, uint size, string name, IntPtr session, out uint result);
            [DllImport("amsi.dll", ExactSpelling=true)]
            static extern void AmsiCloseSession(IntPtr context, IntPtr session);
            [DllImport("amsi.dll", ExactSpelling=true)]
            static extern void AmsiUninitialize(IntPtr context);
            public static bool Run() {
              IntPtr ctx, session;
              int hr=AmsiInitialize("ZEUVORYX reference diagnostic",out ctx);
              Console.WriteLine("initialize: 0x{0:X8}",hr);
              if(hr!=0 || ctx==IntPtr.Zero) return false;
              try {
                hr=AmsiOpenSession(ctx,out session);
                Console.WriteLine("open session: 0x{0:X8}",hr);
                if(hr!=0 || session==IntPtr.Zero) return false;
                try {
                  byte[] data=Encoding.UTF8.GetBytes("ZEUVORYX harmless plain text functional check.");
                  uint result;
                  hr=AmsiScanBuffer(ctx,data,(uint)data.Length,"benign.txt",session,out result);
                  Console.WriteLine("scan: 0x{0:X8}; verdict: {1}",hr,hr==0?result.ToString():"inconclusive");
                  return hr==0 && (result==0 || result==1);
                } finally { AmsiCloseSession(ctx,session); }
              } finally { AmsiUninitialize(ctx); }
            }
          }
          '@
          $passed = 0
          for ($i=0; $i -lt 5; $i++) {
            if ([ZvxAmsiProbe]::Run()) { $passed++ }
          }
          Write-Host "Native benign reference: $passed/5 successful."
          if ($passed -ne 5) { throw 'AMSI native reference not validated; protection remains inconclusive.' }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Compare Go native implementation
        shell: pwsh
        run: |
          go test -v -count=5 ./nativeamsi
          if ($LASTEXITCODE -ne 0) { throw 'Go AMSI validation failed' }
