           $r=[ordered]@{defender=$null;firewall=$null;updates=$null;policies=$null;asr=$null;systemHardening=$null;errors=@()}
           try {$d=Get-MpComputerStatus -ErrorAction Stop;$r.defender=[ordered]@{antivirus=$d.AntivirusEnabled;realTime=$d.RealTimeProtectionEnabled;behavior=$d.BehaviorMonitorEnabled;signatureAge=$d.AntivirusSignatureAge;signatureVersion=$d.AntivirusSignatureVersion;runningMode=$d.AMRunningMode;tamper=$d.IsTamperProtected;ioav=$d.IoavProtectionEnabled;nis=$d.NISEnabled}} catch {$r.errors+= 'Defender indisponível ou acesso negado'}
